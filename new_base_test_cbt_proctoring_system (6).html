        // ==================== 2. UTILITAS UMUM & FULLSCREEN ====================
        function isFullscreenActive() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        async function requestExamFullscreen() {
            const elem = document.documentElement;
            if (!elem || isFullscreenActive()) return true;
            try {
                if (elem.requestFullscreen) {
                    await elem.requestFullscreen({ navigationUI: 'hide' });
                } else if (elem.webkitRequestFullscreen) {
                    await elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    await elem.msRequestFullscreen();
                }
                return isFullscreenActive();
            } catch (_) {
                return false;
            }
        }

        async function exitExamFullscreen() {
            if (!isFullscreenActive()) return;
            try {
                if (document.exitFullscreen) {
                    await document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    await document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    await document.msExitFullscreen();
                }
            } catch (_) {}
        }

        function showFullscreenLockOverlay(customReason = '') {
            if (!activeExamSession || currentUser?.role !== 'student') return;
            let overlay = document.getElementById('fullscreenLockOverlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'fullscreenLockOverlay';
                overlay.className = 'fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4';
                document.body.appendChild(overlay);
            }
            overlay.innerHTML = `
                <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-rose-200 p-6 text-center space-y-4">
                    <div class="w-14 h-14 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto">

                    </div>
                    <div class="space-y-1.5">
                        <span class="inline-block px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 text-[11px] font-extrabold">
                            LAYAR SOAL DIKUNCI SEMENTARA
                        </span>
                        <h3 class="text-base font-extrabold text-slate-900">Mode Layar Penuh Wajib Aktif</h3>
                        <p class="text-xs text-slate-600 leading-relaxed">
                            ${escapeHtml(customReason || 'Anda terdeteksi keluar dari tampilan layar penuh saat ujian berlangsung. Ketuk tombol di bawah untuk mengaktifkan kembali layar penuh dan membuka soal.')}
                        </p>
                    </div>
                    <button type="button" onclick="reenterExamFullscreenNow()"
                        class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-xs font-extrabold shadow-lg transition">
                        <i class="fa-solid fa-expand mr-1.5"></i>Kembali ke Layar Penuh
                    </button>
                </div>
            `;
            overlay.classList.remove('hidden');
        }

        function hideFullscreenLockOverlay() {
            const overlay = document.getElementById('fullscreenLockOverlay');
            if (overlay) {
                overlay.classList.add('hidden');
            }
        }

        window.reenterExamFullscreenNow = async function() {
            const ok = await requestExamFullscreen();
            if (ok || isFullscreenActive()) {
                hideFullscreenLockOverlay();
            } else {
                // Fallback ramah Safari iOS yang tidak mendukung Fullscreen API standar pada elemen non-video
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    hideFullscreenLockOverlay();
                    showModalMessage(
                        'Mode Fokus Perangkat iOS',
                        'Peramban Safari iOS membatasi API layar penuh standar. Tetap berada di tab ini dan jangan berpindah aplikasi agar tidak tercatat sebagai pelanggaran.',
                        'info'
                    );
                }
            }
        };

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getDeviceToken() {
            let token = localStorage.getItem(DEVICE_TOKEN_KEY);
            if (!token) {
                token = 'dev-' + Math.random().toString(36).slice(2) + '-' + Date.now();
                localStorage.setItem(DEVICE_TOKEN_KEY, token);
            }
            return token;
        }

        function formatSeconds(sec) {
            const s = Math.max(0, Math.floor(Number(sec) || 0));
            const hrs = Math.floor(s / 3600);
            const mins = Math.floor((s % 3600) / 60);
            const rem = s % 60;
            if (hrs > 0) {
                return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
            }
            return `${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
        }

        function formatDateTimeDisplay(val) {
            if (!val) return 'Fleksibel (Kapan Saja)';
            try {
                const d = new Date(val);
                if (isNaN(d.getTime())) return val;
                return d.toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (_) {
                return val;
            }
        }

        function getFolderScheduleStatus(folder) {
            const now = Date.now();
            if (folder.scheduleStart) {
                const start = new Date(folder.scheduleStart).getTime();
                if (!isNaN(start) && now < start) {
                    return { code: 'upcoming', label: 'Belum Dibuka', canEnter: false };
                }
            }
            if (folder.scheduleEnd) {
                const end = new Date(folder.scheduleEnd).getTime();
                if (!isNaN(end) && now > end) {
                    return { code: 'closed', label: 'Waktu Berakhir', canEnter: false };
                }
            }
            return { code: 'open', label: 'Sedang Dibuka', canEnter: true };
        }

        function getAdminUsers() {
            return (appState.users || []).filter(u => u.role === 'admin');
        }

        function hasRegisteredAdmin() {
            return getAdminUsers().length > 0;
        }

        function getActiveAdminFolder() {
            const folders = appState.folders || [];
            let found = folders.find(f => f.id === selectedAdminFolderId);
            if (!found && folders.length > 0) {
                selectedAdminFolderId = folders[0].id;
                found = folders[0];
            }
            return found || null;
        }

        function getAllSubmissionsList() {
            return Object.values(appState.submissionsMap || {}).sort(
                (a, b) => new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0)
            );
        }

        function getAllLiveSessionsList() {
            return Object.values(appState.liveSessionsMap || {});
        }

        window.closeGlobalModal = function() {
            const modal = document.getElementById('globalModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');

        function openDynamicModal(htmlContent) {
            const modal = document.getElementById('dynamicModal');
            const body = document.getElementById('dynamicModalBody');
            if (!modal || !body) return;
            body.innerHTML = htmlContent;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.closeDynamicModal = function() {
            const modal = document.getElementById('dynamicModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');

        // ==================== 3. NORMALISASI & PENYIMPANAN CLOUD TERPECAH ====================
        function normalizeFolder(folder, idx = 0) {
            const sec = folder.security || {};
            const validPolicy = ['required', 'optional', 'off'].includes(sec.cameraPolicy)
                ? sec.cameraPolicy
                : 'optional';

            return {
                id: folder.id || ('folder-' + Date.now() + '-' + idx),
                title: folder.title || 'Paket Ujian ' + (idx + 1),
                subject: folder.subject || 'Umum',
                description: folder.description || '',
                scheduleStart: folder.scheduleStart || '',
                scheduleEnd: folder.scheduleEnd || '',
                durationMinutes: Math.max(1, Number(folder.durationMinutes) || 45),
                tokenEnabled: Boolean(folder.tokenEnabled),
                tokenCode: (folder.tokenCode || 'CBT2026').toUpperCase(),
                security: {
                    cameraPolicy: validPolicy,
                    randomizeQuestions: sec.randomizeQuestions !== undefined ? Boolean(sec.randomizeQuestions) : true,
                    randomizeOptions: sec.randomizeOptions !== undefined ? Boolean(sec.randomizeOptions) : true,
                    watermarkEnabled: sec.watermarkEnabled !== undefined ? Boolean(sec.watermarkEnabled) : true,
                    periodicSnapshots: sec.periodicSnapshots !== undefined ? Boolean(sec.periodicSnapshots) : true,
                    snapshotIntervalSec: Math.max(20, Number(sec.snapshotIntervalSec) || 45),
                    blockShortcuts: sec.blockShortcuts !== undefined ? Boolean(sec.blockShortcuts) : true,
                    detectSplitScreen: sec.detectSplitScreen !== undefined ? Boolean(sec.detectSplitScreen) : true,
                    singleSessionLock: sec.singleSessionLock !== undefined ? Boolean(sec.singleSessionLock) : true
                },
                questions: Array.isArray(folder.questions) ? folder.questions : []
            };
        }

        function normalizeMetaDoc(raw) {
            const data = raw || {};
            const folders = Array.isArray(data.folders) && data.folders.length > 0
                ? data.folders.map((f, idx) => normalizeFolder(f, idx))
                : DEFAULT_STATE.folders.map((f, idx) => normalizeFolder(f, idx));

            let deviceLocks = {};
            if (typeof data.activeDeviceLocks === 'string') {
                try { deviceLocks = JSON.parse(data.activeDeviceLocks) || {}; } catch (_) { deviceLocks = {}; }
            } else if (data.activeDeviceLocks && typeof data.activeDeviceLocks === 'object') {
                deviceLocks = data.activeDeviceLocks;
            }

            return {
                folders,
                users: Array.isArray(data.users) ? data.users : JSON.parse(JSON.stringify(DEFAULT_STATE.users)),
                activeDeviceLocks: deviceLocks
            };
        }

        function saveLocalMirror() {
            try {
                localStorage.setItem(LOCAL_MIRROR_KEY, JSON.stringify(appState));
            } catch (_) {}
        }

        function loadLocalMirror() {
            try {
                const raw = localStorage.getItem(LOCAL_MIRROR_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                const meta = normalizeMetaDoc(parsed);
                return {
                    ...meta,
                    submissionsMap: parsed.submissionsMap && typeof parsed.submissionsMap === 'object' ? parsed.submissionsMap : {},
                    liveSessionsMap: parsed.liveSessionsMap && typeof parsed.liveSessionsMap === 'object' ? parsed.liveSessionsMap : {}
                };
            } catch (_) {
                return null;
            }
        }

        // Antrean sinkronisasi offline -> online
        function getPendingQueue() {
            try {
                return JSON.parse(localStorage.getItem(PENDING_QUEUE_KEY) || '{}');
            } catch (_) {
                return {};
            }
        }

        function enqueueSyncTask(taskKey, payload) {
            try {
                const q = getPendingQueue();
                q[taskKey] = {
                    ...payload,
                    queuedAt: Date.now()
                };
                localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(q));
            } catch (_) {}
        }

        function clearSyncTask(taskKey) {
            try {
                const q = getPendingQueue();
                if (q[taskKey]) {
                    delete q[taskKey];
                    localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(q));
                }
            } catch (_) {}
        }

        function hasAnyPendingQueue() {
            return Object.keys(getPendingQueue()).length > 0;
        }

        function resolveFirebaseConfig() {
            try {
                const customRaw = localStorage.getItem(CUSTOM_FIREBASE_CONFIG_KEY);
                if (customRaw) {
                    const parsed = JSON.parse(customRaw);
                    if (parsed && parsed.apiKey && parsed.projectId) {
                        return { config: parsed, source: 'Proyek Kustom Anda' };
                    }
                }
            } catch (_) {}

            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                try {
                    const envCfg = typeof __firebase_config === 'string'
                        ? JSON.parse(__firebase_config)
                        : __firebase_config;
                    if (envCfg && envCfg.apiKey && envCfg.projectId) {
                        return { config: envCfg, source: 'Cloud Bawaan' };
                    }
                } catch (_) {}
            }
            return { config: null, source: 'Belum Terhubung' };
        }

        function updateSyncStatusBadge(text) {
            cloudSyncStatus = text;
            const els = document.querySelectorAll('[data-sync-badge]');
            els.forEach(el => {
                el.textContent = text;
            });
        }

        function getMetaDocRef() {
            return doc(db, 'artifacts', appId, 'public', 'data', 'cbt_config', 'main_meta');
        }

        function getResultDocRef(shardKey) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'cbt_results', shardKey);
        }

        function getLiveDocRef(shardKey) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'cbt_live', shardKey);
        }

        async function connectFirebaseRealtime(reRender = true) {
            const { config, source } = resolveFirebaseConfig();
            if (!config) {
                cloudConnectedLive = false;
                activeFirebaseProjectId = '-';
                updateSyncStatusBadge('Mode Lokal (Hubungkan Firebase untuk Sinkronisasi Lintas Perangkat)');
                if (reRender) renderApp();
                return false;
            }

            try {
                updateSyncStatusBadge('Menghubungkan Firebase (' + config.projectId + ')...');
                const appName = 'nbt-sharded-' + config.projectId + '-' + Date.now();
                const fbApp = initializeApp(config, appName);
                auth = getAuth(fbApp);
                db = getFirestore(fbApp);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token && source === 'Cloud Bawaan') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // 1. Inisialisasi / baca dokumen meta (folders, users, locks)
                const metaRef = getMetaDocRef();
                const metaSnap = await getDoc(metaRef);
                if (metaSnap.exists()) {
                    const normalized = normalizeMetaDoc(metaSnap.data());
                    appState.folders = normalized.folders;
                    appState.users = normalized.users;
                    appState.activeDeviceLocks = normalized.activeDeviceLocks;
                    saveLocalMirror();
                } else {
                    await setDoc(metaRef, {
                        folders: appState.folders,
                        users: appState.users,
                        activeDeviceLocks: JSON.stringify(appState.activeDeviceLocks || {}),
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                }

                // Lepas listener lama jika ada
                if (unsubscribeMeta) try { unsubscribeMeta(); } catch (_) {}
                if (unsubscribeResults) try { unsubscribeResults(); } catch (_) {}
                if (unsubscribeLive) try { unsubscribeLive(); } catch (_) {}

                const handleSnapshotPermissionError = (err) => {
                    console.warn('Firestore listener permission/connection fallback:', err?.code || err);
                    cloudConnectedLive = false;
                    if (unsubscribeMeta) { try { unsubscribeMeta(); } catch (_) {} unsubscribeMeta = null; }
                    if (unsubscribeResults) { try { unsubscribeResults(); } catch (_) {} unsubscribeResults = null; }
                    if (unsubscribeLive) { try { unsubscribeLive(); } catch (_) {} unsubscribeLive = null; }
                    updateSyncStatusBadge('Mode Lokal (Izin Firestore Ditolak — Periksa Rules)');
                    if (!activeExamSession) renderApp();
                };

                // Listener real-time dokumen meta
                unsubscribeMeta = onSnapshot(metaRef, (snap) => {
                    if (!snap.exists()) return;
                    const normalized = normalizeMetaDoc(snap.data());
                    appState.folders = normalized.folders;
                    appState.users = normalized.users;
                    appState.activeDeviceLocks = normalized.activeDeviceLocks;
                    saveLocalMirror();

                    if (currentUser && currentUser.role === 'student') {
                        const freshUser = appState.users.find(u => u.id === currentUser.id);
                        if (!freshUser) {
                            handleLogout(true);
                            return;
                        }
                        currentUser = freshUser;

                        // Cek penguncian sesi tunggal (anti-login ganda)
                        const folder = (appState.folders || []).find(f => f.id === activeExamSession?.folderId);
                        if (activeExamSession && folder?.security?.singleSessionLock) {
                            const cloudLock = (appState.activeDeviceLocks || {})[currentUser.id];
                            if (cloudLock && cloudLock !== getDeviceToken()) {
                                stopExamProctoring();
                                activeExamSession = null;
                                handleLogout(true);
                                showModalMessage(
                                    'Sesi Terkunci (Login Ganda Terdeteksi)',
                                    'Akun Anda login pada perangkat lain. Sesi ujian di perangkat ini otomatis dihentikan.',
                                    'warning'
                                );
                                return;
                            }
                        }
                    }

                    if (!activeExamSession) {
                        renderApp();
                    }
                }, handleSnapshotPermissionError);

                // 2. Listener real-time koleksi hasil ujian terpecah (cbt_results)
                const resultsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'cbt_results');
                unsubscribeResults = onSnapshot(resultsColRef, (querySnap) => {
                    const nextMap = { ...(appState.submissionsMap || {}) };
                    querySnap.forEach(docItem => {
                        nextMap[docItem.id] = docItem.data();
                    });
                    appState.submissionsMap = nextMap;
                    saveLocalMirror();
                    if (!activeExamSession) {
                        renderApp();
                    }
                }, handleSnapshotPermissionError);

                // 3. Listener real-time koleksi sesi aktif terpecah (cbt_live)
                const liveColRef = collection(db, 'artifacts', appId, 'public', 'data', 'cbt_live');
                unsubscribeLive = onSnapshot(liveColRef, (querySnap) => {
                    const nextLive = {};
                    querySnap.forEach(docItem => {
                        nextLive[docItem.id] = docItem.data();
                    });
                    appState.liveSessionsMap = nextLive;
                    saveLocalMirror();

                    // Jika Admin memaksa kumpulkan ujian peserta ini
                    if (activeExamSession && currentUser?.role === 'student') {
                        const shardKey = `${activeExamSession.folderId}_${currentUser.id}`;
                        const liveDoc = nextLive[shardKey];
                        if (liveDoc && liveDoc.forceSubmittedByAdmin) {
                            const sessCopy = activeExamSession;
                            stopExamProctoring();
                            exitExamFullscreen();
                            finalizeExamSubmission(sessCopy, 'Dikunci & Dikumpulkan Paksa oleh Admin').then(() => {
                                renderApp();
                                showModalMessage('Ujian Dikunci Pengawas', 'Administrator telah menutup dan mengumpulkan sesi ujian Anda.', 'warning');
                            });
                            return;
                        }
                    }

                    if (!activeExamSession) {
                        renderApp();
                    }
                }, handleSnapshotPermissionError);

                cloudConnectedLive = true;
                activeFirebaseProjectId = config.projectId;
                updateSyncStatusBadge('Firebase Aktif (' + config.projectId + ')');
                await flushPendingSyncQueue();
                if (reRender) renderApp();
                return true;
            } catch (err) {
                console.warn('Koneksi Firebase tertunda:', err);
                cloudConnectedLive = false;
                activeFirebaseProjectId = config.projectId || '-';
                updateSyncStatusBadge('Mode Lokal (Periksa Rules / Auth Anonim Firebase)');
                if (reRender) renderApp();
                return false;
            }
        }

        // Simpan dokumen meta (folders, users, locks)
        async function persistMetaState() {
            saveLocalMirror();
            const payload = {
                folders: appState.folders,
                users: appState.users,
                activeDeviceLocks: JSON.stringify(appState.activeDeviceLocks || {}),
                updatedAt: new Date().toISOString()
            };

            if (!navigator.onLine || !db || !cloudConnectedLive) {
                enqueueSyncTask('meta', { type: 'meta', data: payload });
                updateSyncStatusBadge(navigator.onLine ? 'Tersimpan Lokal (Menunggu Koneksi Firebase)' : 'Offline — Antrean Sinkronisasi Aktif');
                return;
            }

            try {
                updateSyncStatusBadge('Menyinkronkan Pengaturan...');
                await setDoc(getMetaDocRef(), payload, { merge: true });
                clearSyncTask('meta');
                updateSyncStatusBadge('Firebase Aktif (' + activeFirebaseProjectId + ')');
            } catch (_) {
                enqueueSyncTask('meta', { type: 'meta', data: payload });
                updateSyncStatusBadge('Tersimpan Lokal (Antrean Sinkronisasi)');
            }
        }

        // Simpan dokumen sesi langsung siswa secara terpecah: cbt_live/{folderId}_{studentId}
        async function persistLiveSessionShard(sessionObj) {
            if (!sessionObj) return;
            const shardKey = `${sessionObj.folderId}_${sessionObj.studentId}`;
            appState.liveSessionsMap = appState.liveSessionsMap || {};
            appState.liveSessionsMap[shardKey] = sessionObj;
            saveLocalMirror();

            if (!navigator.onLine || !db || !cloudConnectedLive) {
                enqueueSyncTask('live_' + shardKey, { type: 'live', shardKey, data: sessionObj });
                updateSyncStatusBadge(navigator.onLine ? 'Tersimpan Lokal' : 'Offline — Jawaban Aman di Perangkat');
                return;
            }

            try {
                await setDoc(getLiveDocRef(shardKey), {
                    ...sessionObj,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                clearSyncTask('live_' + shardKey);
                updateSyncStatusBadge('Tersinkronisasi (' + activeFirebaseProjectId + ')');
            } catch (_) {
                enqueueSyncTask('live_' + shardKey, { type: 'live', shardKey, data: sessionObj });
                updateSyncStatusBadge('Tersimpan Lokal (Menunggu Sinyal)');
            }
        }

        // Simpan dokumen hasil ujian siswa secara terpecah: cbt_results/{folderId}_{studentId}
        async function persistSubmissionShard(submissionObj) {
            const shardKey = `${submissionObj.folderId}_${submissionObj.studentId}`;
            appState.submissionsMap = appState.submissionsMap || {};
            appState.submissionsMap[shardKey] = submissionObj;
            if (appState.liveSessionsMap && appState.liveSessionsMap[shardKey]) {
                delete appState.liveSessionsMap[shardKey];
            }
            saveLocalMirror();

            if (!navigator.onLine || !db || !cloudConnectedLive) {
                enqueueSyncTask('result_' + shardKey, { type: 'result', shardKey, data: submissionObj });
                updateSyncStatusBadge('Offline — Hasil Ujian Akan Terkirim Otomatis Saat Online');
                return;
            }

            try {
                updateSyncStatusBadge('Mengirim Hasil Ujian ke Cloud...');
                await setDoc(getResultDocRef(shardKey), submissionObj, { merge: true });
                try {
                    await deleteDoc(getLiveDocRef(shardKey));
                } catch (_) {}
                clearSyncTask('result_' + shardKey);
                clearSyncTask('live_' + shardKey);
                updateSyncStatusBadge('Firebase Aktif (' + activeFirebaseProjectId + ')');
            } catch (_) {
                enqueueSyncTask('result_' + shardKey, { type: 'result', shardKey, data: submissionObj });
                updateSyncStatusBadge('Tersimpan Lokal (Menunggu Sinyal)');
            }
        }

        async function flushPendingSyncQueue() {
            if (!navigator.onLine) return;
            const { config } = resolveFirebaseConfig();
            if (config && (!db || !cloudConnectedLive)) {
                await connectFirebaseRealtime(false);
            }
            if (!db || !cloudConnectedLive) return;

            const queue = getPendingQueue();
            const keys = Object.keys(queue);
            if (keys.length === 0) return;

            updateSyncStatusBadge('Menyinkronkan ' + keys.length + ' antrean ke Cloud...');
            for (const key of keys) {
                const item = queue[key];
                try {
                    if (item.type === 'meta') {
                        await setDoc(getMetaDocRef(), item.data, { merge: true });
                    } else if (item.type === 'live') {
                        await setDoc(getLiveDocRef(item.shardKey), item.data, { merge: true });
                    } else if (item.type === 'result') {
                        await setDoc(getResultDocRef(item.shardKey), item.data, { merge: true });
                        try { await deleteDoc(getLiveDocRef(item.shardKey)); } catch (_) {}
                    }
                    clearSyncTask(key);
                } catch (_) {}
            }
            updateSyncStatusBadge('Firebase Aktif (' + activeFirebaseProjectId + ')');
        }

        window.saveFirebaseConfigFromUI = async function() {
            const inputEl = document.getElementById('firebaseConfigInput');
            if (!inputEl) return;
            let raw = inputEl.value.trim();
            if (!raw) {
                showModalMessage('Input Kosong', 'Silakan tempelkan objek firebaseConfig terlebih dahulu.', 'warning');
                return;
            }

            try {
                const braceStart = raw.indexOf('{');
                const braceEnd = raw.lastIndexOf('}');
                if (braceStart !== -1 && braceEnd !== -1) {
                    raw = raw.slice(braceStart, braceEnd + 1);
                }
                const normalizedJson = raw
                    .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
                    .replace(/'/g, '"')
                    .replace(/,\s*}/g, '}');
                const parsedCfg = JSON.parse(normalizedJson);

                if (!parsedCfg.apiKey || !parsedCfg.projectId) {
                    showModalMessage('Konfigurasi Tidak Lengkap', 'Pastikan objek berisi minimal apiKey dan projectId.', 'error');
                    return;
                }

                localStorage.setItem(CUSTOM_FIREBASE_CONFIG_KEY, JSON.stringify(parsedCfg));
                closeDynamicModal();
                const ok = await connectFirebaseRealtime(true);
                if (ok) {
                    await persistMetaState();
                    showModalMessage('Firebase Terhubung', 'Berhasil terhubung ke proyek Firebase: ' + parsedCfg.projectId, 'success');
                } else {
                    showModalMessage('Koneksi Tertunda', 'Konfigurasi tersimpan, namun koneksi Firebase gagal. Pastikan Anonymous Auth & Firestore Rules aktif.', 'warning');
                }
            } catch (_) {
                showModalMessage('Format Tidak Valid', 'Pastikan format objek firebaseConfig yang ditempelkan valid.', 'error');
            }
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername')?.value.trim();
            const password = document.getElementById('loginPassword')?.value.trim();
            const pinInput = document.getElementById('loginAdminPin')?.value.trim() || '';

            if (!username || !password) {
                showModalMessage('Isi Data Login', 'Masukkan username dan password Anda.', 'warning');
                return;
            }

            if (loginRole === 'admin') {
                const matchedAdmin = appState.users.find(
                    u => u.role === 'admin' && u.username.toLowerCase() === username.toLowerCase() && u.password === password
                );
                if (!matchedAdmin) {
                    showModalMessage('Login Admin Gagal', 'Username atau password Administrator tidak sesuai.', 'error');
                    return;
                }
                if (matchedAdmin.accessPin && matchedAdmin.accessPin !== pinInput) {
                    showModalMessage('Kode PIN Salah', 'Kode Akses / PIN Administrator tidak cocok.', 'error');
                    return;
                }
                currentUser = matchedAdmin;
                activeMenu = 'ujian';
                localStorage.setItem(SESSION_KEY, JSON.stringify({ userId: matchedAdmin.id }));
                renderApp();
                return;
            }

            const matchedStudent = appState.users.find(
                u => u.role === 'student' &&
                    u.username.toLowerCase() === username.toLowerCase() &&
                    u.password === password &&
                    (u.category || 'instansi') === loginCategory
            );

            if (!matchedStudent) {
                showModalMessage('Login Peserta Gagal', 'Periksa kembali jalur peserta (Instansi/Mandiri), username, dan password Anda.', 'error');
                return;

            // Kunci sesi perangkat tunggal untuk peserta

            appState.activeDeviceLocks = appState.activeDeviceLocks || {};
            appState.activeDeviceLocks[matchedStudent.id] = devToken;
            await persistMetaState();

            currentUser = matchedStudent;
            activeMenu = 'ujian';
            localStorage.setItem(SESSION_KEY, JSON.stringify({ userId: matchedStudent.id }));

            // Cek apakah peserta memiliki sesi ujian yang terputus/keluar sebelumnya
            const liveEntries = getAllLiveSessionsList().filter(s => s.studentId === matchedStudent.id);
            if (liveEntries.length > 0) {
                await resumeInterruptedExamSession(liveEntries[0]);
            } else {
                renderApp();
            }
        };

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

                return;

        window.verifyTokenAndStartExam = function(e, folderId) {
            e.preventDefault();
            const folder = (appState.folders || []).find(f => f.id === folderId);
            if (!folder) return;
            const entered = (document.getElementById('studentTokenInput')?.value || '').trim().toUpperCase();
            if (entered !== (folder.tokenCode || '').trim().toUpperCase()) {
                showModalMessage('Token Tidak Valid', 'Kode token ujian yang Anda masukkan salah.', 'error');
                return;
            }
            closeDynamicModal();
            beginFolderExam(folder.id);
        };

        async function initializeExamCamera(policy) {
            cameraBlockedFlag = false;
            if (policy === 'off') {
                cameraStatusNote = 'Kamera dinonaktifkan oleh Admin pada folder ini.';
                return true;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                cameraStatusNote = 'Peramban tidak mendukung akses kamera.';
                cameraBlockedFlag = true;
                return policy !== 'required';
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
                    audio: false
                });
                cameraStream = stream;
                cameraStatusNote = 'Kamera Pengawas Aktif';
                const video = document.getElementById('proctorCameraVideo');
                if (video) {
                    video.srcObject = stream;
                }
                return true;
            } catch (_) {
                cameraBlockedFlag = true;
                cameraStatusNote = 'Izin kamera ditolak/tidak ditemukan. Buka Pengaturan Situs di Chrome HP -> Izinkan Kamera.';
                return policy !== 'required';
            }
        }

        async function beginFolderExam(folderId) {
            const folder = (appState.folders || []).find(f => f.id === folderId);
            if (!folder || !currentUser) return;

            const sec = folder.security || {};
            const camOk = await initializeExamCamera(sec.cameraPolicy || 'optional');
            if (!camOk) {
                showModalMessage(
                    'Kamera Wajib Diaktifkan',
                    'Folder ujian ini mewajibkan kamera aktif. Izinkan akses kamera pada ikon gembok di bilah alamat Chrome HP/Laptop Anda lalu coba lagi.',
                    'error'
                );
                return;
            }

            const baseQuestions = [...(folder.questions || [])];
            const orderedQuestions = sec.randomizeQuestions ? shuffleArray(baseQuestions) : baseQuestions;

            const questionOrder = orderedQuestions.map(q => q.id);
            const optionOrders = {};
            orderedQuestions.forEach(q => {
                const indices = (q.options || []).map((_, idx) => idx);
                optionOrders[q.id] = (sec.randomizeOptions && q.type !== 'uraian') ? shuffleArray(indices) : indices;
            });

            const sessionObj = {
                folderId: folder.id,
                folderTitle: folder.title,
                studentId: currentUser.id,
                studentName: currentUser.fullName,
                participantId: currentUser.participantId || currentUser.username,
                startedAt: new Date().toISOString(),
                remainingSeconds: (Number(folder.durationMinutes) || 45) * 60,
                currentIndex: 0,
                questionOrder,
                optionOrders,
                answers: {},
                violations: 0,
                violationLogs: [],
                snapshots: [],
                forceSubmittedByAdmin: false
            };

            activeExamSession = sessionObj;
            await persistLiveSessionShard(sessionObj);
            await requestExamFullscreen();
            renderApp();
            startExamProctoring();
        }

        async function resumeInterruptedExamSession(savedSession) {
            if (!savedSession || !currentUser) return;
            const logs = Array.isArray(savedSession.violationLogs) ? [...savedSession.violationLogs] : [];
            logs.push({
                time: new Date().toLocaleTimeString('id-ID'),
                reason: 'Keluar / menutup halaman ujian dan otomatis masuk kembali'
            });

            activeExamSession = {
                ...savedSession,
                violations: (Number(savedSession.violations) || 0) + 1,
                violationLogs: logs
            };

            const folder = (appState.folders || []).find(f => f.id === activeExamSession.folderId);
            await initializeExamCamera(folder?.security?.cameraPolicy || 'optional');
            await persistLiveSessionShard(activeExamSession);
            await requestExamFullscreen();
            renderApp();
            startExamProctoring();

            if (!isFullscreenActive()) {
                showFullscreenLockOverlay('Sesi ujian dipulihkan otomatis. Ketuk tombol di bawah untuk mengaktifkan kembali layar penuh.');
            } else {
                showModalMessage(
                    'Sesi Ujian Dipulihkan Otomatis',
                    'Anda langsung masuk kembali ke ruang ujian dengan jawaban dan sisa waktu terakhir, serta 1 pelanggaran dicatat.',
                    'warning'
                );
            }
        }

            if (!activeExamSession) return;

        window.toggleComplexChoiceAnswer = async function(questionId, origIdx) {
            if (!activeExamSession) return;
            const current = Array.isArray(activeExamSession.answers[questionId])
                ? [...activeExamSession.answers[questionId]]
                : [];
            const pos = current.indexOf(origIdx);
            if (pos === -1) current.push(origIdx);
            else current.splice(pos, 1);
            activeExamSession.answers[questionId] = current;
            renderApp();
            await persistLiveSessionShard(activeExamSession);
        };

        async function recordExamViolation(reason) {
            if (!activeExamSession || !currentUser || currentUser.role !== 'student') return;
            activeExamSession.violations = (Number(activeExamSession.violations) || 0) + 1;
            activeExamSession.violationLogs = activeExamSession.violationLogs || [];
            activeExamSession.violationLogs.push({

            const badge = document.getElementById('examViolationCountBadge');

            }
            await persistLiveSessionShard(activeExamSession);

        // Kompresi snapshot kamera ke 240x180 JPEG quality 0.4 agar hemat kuota Firestore (<1MB)
        function captureCompressedCameraSnapshot() {
            if (!activeExamSession) return;
            const video = document.getElementById('proctorCameraVideo');
            if (!video || video.readyState < 2) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 240;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.4);

                activeExamSession.snapshots = activeExamSession.snapshots || [];
                if (activeExamSession.snapshots.length >= 10) {
                    activeExamSession.snapshots.shift();
                }
                activeExamSession.snapshots.push({
                    time: new Date().toLocaleTimeString('id-ID'),
                    image: compressedDataUrl
                });
                persistLiveSessionShard(activeExamSession);
            } catch (_) {}
        }

        function stopExamProctoring() {
            if (examTimerInterval) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
            }
            if (snapshotIntervalTimer) {
                clearInterval(snapshotIntervalTimer);
                snapshotIntervalTimer = null;
            }
            if (fullscreenGuardInterval) {
                clearInterval(fullscreenGuardInterval);
                fullscreenGuardInterval = null;
            }
            hideFullscreenLockOverlay();
            if (cameraStream) {
                try {
                    cameraStream.getTracks().forEach(t => t.stop());
                } catch (_) {}
                cameraStream = null;
            }
        }

        function startExamProctoring() {
            stopExamProctoring();
            if (!activeExamSession) return;

            initialViewportArea = window.innerWidth * window.innerHeight;
            lastMonotonicTickMs = performance.now();

            // Pastikan video stream terpasang setelah render ulang DOM
            setTimeout(() => {
                const video = document.getElementById('proctorCameraVideo');
                if (video && cameraStream && video.srcObject !== cameraStream) {
                    video.srcObject = cameraStream;
                }
            }, 100);

            // Penjagaan fullscreen berkala
            fullscreenGuardInterval = setInterval(() => {
                if (!activeExamSession || currentUser?.role !== 'student') return;
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (!isIOS && !isFullscreenActive()) {
                    showFullscreenLockOverlay('Tampilan layar penuh tidak aktif. Ketuk tombol di bawah untuk mengembalikan layar penuh dan melanjutkan ujian.');
                } else {
                    hideFullscreenLockOverlay();
                }
            }, 1200);

            const folder = (appState.folders || []).find(f => f.id === activeExamSession.folderId);
            const sec = folder?.security || {};
            if (sec.periodicSnapshots && sec.cameraPolicy !== 'off') {
                const intervalMs = Math.max(20, Number(sec.snapshotIntervalSec) || 45) * 1000;
                snapshotIntervalTimer = setInterval(() => {
                    captureCompressedCameraSnapshot();
                }, intervalMs);
            }

            // Monotonic Elapsed Timer berbasis performance.now() (tahan manipulasi jam HP/laptop)
            let secondsAccumulator = 0;
            examTimerInterval = setInterval(async () => {
                if (!activeExamSession) return;
                const nowMono = performance.now();
                const deltaSec = (nowMono - lastMonotonicTickMs) / 1000;
                lastMonotonicTickMs = nowMono;

                // Batasi lonjakan delta wajar jika thread sempat tertunda
                secondsAccumulator += Math.min(Math.max(deltaSec, 0), 5);
                if (secondsAccumulator >= 1) {
                    const wholeSec = Math.floor(secondsAccumulator);
                    secondsAccumulator -= wholeSec;
                    activeExamSession.remainingSeconds = Math.max(0, Number(activeExamSession.remainingSeconds) - wholeSec);
                }

                const timerEl = document.getElementById('examTimerDisplay');
                if (timerEl) {
                    timerEl.textContent = formatSeconds(activeExamSession.remainingSeconds);
                }

                // Sinkronisasi berkala setiap 15 detik sisa waktu
                if (Math.floor(activeExamSession.remainingSeconds) % 15 === 0) {
                    persistLiveSessionShard(activeExamSession);
                }

                if (activeExamSession.remainingSeconds <= 0) {
                    const sessToSubmit = activeExamSession;
                    stopExamProctoring();
                    await exitExamFullscreen();
                    await finalizeExamSubmission(sessToSubmit, 'Waktu Habis (Otomatis)');
                    renderApp();
                    showModalMessage('Waktu Ujian Habis', 'Waktu pengerjaan telah berakhir dan jawaban Anda otomatis dikumpulkan.', 'info');
                }
            }, 500);
        }

        async function finalizeExamSubmission(sess, submitReason = 'Dikumpulkan Peserta') {
            const folder = (appState.folders || []).find(f => f.id === sess.folderId);
            const questions = folder ? (folder.questions || []) : [];
            let autoScore = 0;
            let hasEssay = false;

            questions.forEach(q => {
                const pts = Number(q.points) || 0;
                const ans = sess.answers ? sess.answers[q.id] : undefined;
                if (q.type === 'pg') {
                    if (ans !== undefined && Number(ans) === Number(q.correctOption)) {
                        autoScore += pts;
                    }
                } else if (q.type === 'pg_kompleks') {
                    const expected = Array.isArray(q.correctOptions) ? [...q.correctOptions].sort() : [];
                    const given = Array.isArray(ans) ? [...ans].sort() : [];
                    if (expected.length > 0 && expected.length === given.length && expected.every((v, i) => v === given[i])) {
                        autoScore += pts;
                    }
                } else if (q.type === 'uraian') {
                    hasEssay = true;
                }
            });

            const submissionObj = {
                id: `${sess.folderId}_${sess.studentId}`,
                folderId: sess.folderId,
                folderTitle: sess.folderTitle,
                studentId: sess.studentId,
                studentName: sess.studentName,
                participantId: sess.participantId,
                submittedAt: new Date().toISOString(),
                submitReason,
                answers: sess.answers || {},
                autoScore,
                essayScore: 0,
                totalScore: autoScore,
                hasEssay,
                essayGraded: !hasEssay,
                violations: Number(sess.violations) || 0,
                violationLogs: sess.violationLogs || [],
                snapshots: sess.snapshots || []
            };

            activeExamSession = null;
            await persistSubmissionShard(submissionObj);
        }

            if (!activeExamSession) return;
            const currentSess = activeExamSession;

            await exitExamFullscreen();
            await finalizeExamSubmission(currentSess, reason);
            renderApp();

        window.createNewExamFolder = async function(e) {
            e.preventDefault();
            const title = document.getElementById('newFolderTitle')?.value.trim();
            const subject = document.getElementById('newFolderSubject')?.value.trim();
            const description = document.getElementById('newFolderDesc')?.value.trim();
            const durationMinutes = Math.max(1, Number(document.getElementById('newFolderDuration')?.value) || 45);
            const scheduleStart = document.getElementById('newFolderStart')?.value || '';
            const scheduleEnd = document.getElementById('newFolderEnd')?.value || '';
            const tokenEnabled = Boolean(document.getElementById('newFolderTokenEnabled')?.checked);
            const tokenCode = (document.getElementById('newFolderTokenCode')?.value || 'CBT2026').trim().toUpperCase();
            const cameraPolicy = document.getElementById('newFolderCameraPolicy')?.value || 'optional';

            if (!title) return;
            const newFolder = normalizeFolder({
                id: 'folder-' + Date.now(),
                title,
                subject,
                description,
                durationMinutes,
                scheduleStart,
                scheduleEnd,
                tokenEnabled,
                tokenCode,
                security: {
                    cameraPolicy
                },
                questions: []
            }, appState.folders.length);

            appState.folders.push(newFolder);
            selectedAdminFolderId = newFolder.id;
            closeDynamicModal();
            await persistMetaState();
            renderApp();
        };

        window.saveQuestionToFolder = async function(e, existingId) {
            e.preventDefault();
            const folder = getActiveAdminFolder();
            if (!folder) return;

            const type = document.getElementById('qFormType')?.value || 'pg';
            const points = Math.max(1, Number(document.getElementById('qFormPoints')?.value) || 20);
            const text = document.getElementById('qFormText')?.value.trim();
            if (!text) return;

            let options = [];
            let correctOption = 0;
            let correctOptions = [];

            if (type !== 'uraian') {
                for (let i = 0; i < 4; i++) {
                    const optVal = document.getElementById('qOptText_' + i)?.value.trim() || '';
                    if (optVal) {
                        const newIdx = options.length;
                        options.push(optVal);
                        if (document.getElementById('qOptCorrect_' + i)?.checked) {
                            correctOptions.push(newIdx);
                        }
                    }
                }
                if (options.length < 2) {
                    showModalMessage('Opsi Kurang', 'Isi minimal 2 pilihan jawaban untuk soal pilihan ganda.', 'warning');
                    return;
                }
                if (correctOptions.length === 0) correctOptions = [0];
                correctOption = correctOptions[0];
            }

            const qObj = {
                id: existingId || ('q-' + Date.now()),
                type,
                text,
                options,
                correctOption,
                correctOptions,
                points
            };

            folder.questions = folder.questions || [];
            if (existingId) {
                const idx = folder.questions.findIndex(q => q.id === existingId);
                if (idx !== -1) folder.questions[idx] = qObj;
            } else {
                folder.questions.push(qObj);
            }

            closeDynamicModal();
            await persistMetaState();
            renderApp();
        };

        window.exportSubmissionsCSV = function() {
            const list = getAllSubmissionsList();
            if (list.length === 0) {
                showModalMessage('Belum Ada Data', 'Belum ada hasil ujian untuk diekspor.', 'warning');
                return;
            }
            const headers = ['ID Peserta', 'Nama Peserta', 'Folder Ujian', 'Waktu Kirim', 'Skor Pilihan', 'Skor Uraian', 'Total Skor', 'Pelanggaran', 'Keterangan'];
            const rows = list.map(s => [
                `"${(s.participantId || '').replace(/"/g, '""')}"`,
                `"${(s.studentName || '').replace(/"/g, '""')}"`,
                `"${(s.folderTitle || '').replace(/"/g, '""')}"`,
                `"${formatDateTimeDisplay(s.submittedAt)}"`,
                s.autoScore || 0,
                s.essayScore || 0,
                s.totalScore || 0,
                s.violations || 0,
                `"${(s.submitReason || '').replace(/"/g, '""')}"`
            ].join(','));

            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Laporan_Nilai_NewBaseTest.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

                                                            <button type="button" onclick="openQuestionEditorModal('${escapeHtml(q.id)}')" class="px-2.5 py-1 rounded-lg bg-slate-100 text-xs font-bold text-slate-700">Edit</button>
                                                            <button type="button" onclick="deleteQuestionFromFolder('${escapeHtml(q.id)}')" class="px-2.5 py-1 rounded-lg bg-rose-50 text-xs font-bold text-rose-600">Hapus</button>
                                                        </div>
                                                    </div>
                                                    <div class="text-[11px] text-slate-500">
                                                        Tipe: <strong>${q.type.toUpperCase()}</strong> &bull; Bobot: <strong>${q.points} poin</strong>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                        ` : activeMenu === 'monitor' ? `
                            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4">
                                <div>
                                    <h2 class="text-base font-extrabold text-slate-900">Live Monitoring Peserta Aktif</h2>
                                    <p class="text-xs text-slate-500">Pantau peserta yang sedang mengerjakan ujian secara real-time melalui dokumen terpecah <code>cbt_live</code>.</p>
                                </div>
                                ${liveSessions.length === 0 ? `
                                    <div class="text-center py-8 text-xs text-slate-500">Tidak ada peserta yang sedang aktif mengerjakan ujian saat ini.</div>
                                ` : `
                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        ${liveSessions.map(sess => {
                                            const shardKey = `${sess.folderId}_${sess.studentId}`;
                                            return `
                                                <div class="rounded-2xl border border-slate-200 p-4 space-y-3 bg-slate-50">
                                                    <div class="flex items-center justify-between">
                                                        <div class="font-extrabold text-xs text-slate-900">${escapeHtml(sess.studentName)}</div>
                                                        <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold">Sedang Ujian</span>
                                                    </div>
                                                    <div class="text-[11px] text-slate-600 space-y-1">
                                                        <div>Folder: <strong>${escapeHtml(sess.folderTitle)}</strong></div>
                                                        <div>Progres: <strong>Soal ${(sess.currentIndex || 0) + 1} / ${(sess.questionOrder || []).length}</strong></div>
                                                        <div>Sisa Waktu: <strong>${formatSeconds(sess.remainingSeconds)}</strong></div>
                                                        <div>Pelanggaran: <strong class="text-rose-600">${sess.violations || 0}x</strong></div>
                                                    </div>
                                                    <button type="button" onclick="forceSubmitStudentSession('${escapeHtml(shardKey)}')"
                                                        class="w-full py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">
                                                        Kunci &amp; Paksa Kumpulkan
                                                    </button>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `}
                            </div>
                        ` : activeMenu === 'nilai' ? `
                            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4">
                                <div class="flex flex-wrap items-center justify-between gap-3">
                                    <div>
                                        <h2 class="text-base font-extrabold text-slate-900">Laporan Nilai, Koreksi Uraian &amp; Bukti Pengawasan</h2>
                                        <p class="text-xs text-slate-500">Disimpan per dokumen unik peserta (<code>cbt_results</code>) anti-tabrakan.</p>
                                    </div>
                                    <button type="button" onclick="exportSubmissionsCSV()"
                                        class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">
                                        <i class="fa-solid fa-file-csv mr-1.5"></i>Ekspor CSV
                                    </button>
                                </div>
                                ${submissions.length === 0 ? `
                                    <div class="text-center py-8 text-xs text-slate-500">Belum ada hasil ujian yang dikumpulkan peserta.</div>
                                ` : `
                                    <div class="space-y-4">
                                        ${submissions.map(sub => {
                                            const shardKey = `${sub.folderId}_${sub.studentId}`;
                                            return `
                                                <div class="rounded-2xl border border-slate-200 p-4 space-y-3">
                                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                                        <div>
                                                            <div class="text-sm font-extrabold text-slate-900">${escapeHtml(sub.studentName)} (${escapeHtml(sub.participantId)})</div>
                                                            <div class="text-xs text-slate-500">${escapeHtml(sub.folderTitle)} &bull; ${formatDateTimeDisplay(sub.submittedAt)} &bull; ${escapeHtml(sub.submitReason)}</div>
                                                        </div>
                                                        <div class="flex items-center gap-3">
                                                            <span class="px-3 py-1 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold">Pelanggaran: ${sub.violations}x</span>
                                                            <span class="px-3 py-1 rounded-xl bg-blue-600 text-white text-xs font-extrabold">Total: ${sub.totalScore}</span>
                                                        </div>
                                                    </div>
                                                    ${sub.hasEssay ? `
                                                        <div class="flex items-center gap-2 bg-slate-50 p-3 rounded-xl">
                                                            <span class="text-xs font-bold text-slate-700">Input Nilai Uraian:</span>
                                                            <input type="number" min="0" value="${sub.essayScore || 0}" onchange="gradeEssaySubmission('${escapeHtml(shardKey)}', this.value)"
                                                                class="w-24 rounded-lg border border-slate-300 px-2.5 py-1 text-xs" />
                                                        </div>
                                                    ` : ''}
                                                    ${Array.isArray(sub.snapshots) && sub.snapshots.length > 0 ? `
                                                        <div class="space-y-1.5">
                                                            <div class="text-[11px] font-bold text-slate-600">Galeri Snapshot Kamera Terkompres (${sub.snapshots.length} foto):</div>
                                                            <div class="flex gap-2 overflow-x-auto pb-1">
                                                                ${sub.snapshots.map(snap => `
                                                                    <div class="shrink-0 text-center">
                                                                        <img src="${snap.image}" alt="Snapshot" class="w-24 h-18 object-cover rounded-lg border border-slate-200" />
                                                                        <div class="text-[10px] text-slate-500 mt-0.5">${escapeHtml(snap.time)}</div>
                                                                    </div>
                                                                `).join('')}
                                                            </div>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `}
                            </div>
                        ` : `
                            <!-- Menu Profil, Akun & Konfigurasi Firebase Cloud -->
                            <div class="space-y-5">
                                ${renderFirebaseCloudPanel()}

                                <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
                                    <form onsubmit="createNewUserAccount(event)" class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
                                        <h3 class="text-sm font-extrabold text-slate-900">Tambah Akun Peserta / Administrator Baru</h3>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">Peran Akun</label>
                                            <select id="newUserRole" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                                                <option value="student">Peserta Ujian (Siswa)</option>
                                                <option value="admin">Administrator</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">Jalur Peserta</label>
                                            <select id="newUserCategory" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                                                <option value="instansi">Instansi Sekolah</option>
                                                <option value="mandiri">Mandiri</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap</label>
                                            <input id="newUserName" type="text" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">Instansi / Kelas</label>
                                            <input id="newUserInst" type="text" placeholder="Contoh: SMA Negeri 1" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
                                        </div>
                                        <div class="grid grid-cols-2 gap-2">
                                            <div>
                                                <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>
                                                <input id="newUserUsername" type="text" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                                                <input id="newUserPassword" type="text" required class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
                                            </div>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-700 mb-1">PIN Admin (Khusus jika peran Admin)</label>
                                            <input id="newUserPin" type="text" placeholder="Contoh: 1234" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
                                        </div>
                                        <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold">
                                            Simpan Akun Baru
                                        </button>
                                    </form>

                                    <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                            <h3 class="text-sm font-extrabold text-slate-900">Daftar Pengguna Terdaftar (${filteredUsers.length})</h3>
                                            <div class="flex items-center gap-2">
                                                <input type="text" value="${escapeHtml(participantSearchQuery)}" oninput="updateUserSearch(this.value)"
                                                    placeholder="Cari nama/username..." class="rounded-lg border border-slate-300 px-2.5 py-1 text-xs" />
                                                <select onchange="updateUserFilter(this.value)" class="rounded-lg border border-slate-300 px-2 py-1 text-xs">
                                                    <option value="all" ${participantTrackFilter === 'all' ? 'selected' : ''}>Semua</option>
                                                    <option value="instansi" ${participantTrackFilter === 'instansi' ? 'selected' : ''}>Instansi</option>
                                                    <option value="mandiri" ${participantTrackFilter === 'mandiri' ? 'selected' : ''}>Mandiri</option>
                                                    <option value="admin" ${participantTrackFilter === 'admin' ? 'selected' : ''}>Admin</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="overflow-x-auto">
                                            <table class="w-full text-left text-xs">
                                                <thead class="bg-slate-50 border-b border-slate-200 text-slate-600">
                                                    <tr>
                                                        <th class="p-2.5">Nama</th>
                                                        <th class="p-2.5">Peran / Jalur</th>
                                                        <th class="p-2.5">Username</th>
                                                        <th class="p-2.5">Password</th>
                                                        <th class="p-2.5">Aksi</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-100">
                                                    ${filteredUsers.map(u => `
                                                        <tr>
                                                            <td class="p-2.5 font-bold text-slate-900">${escapeHtml(u.fullName)}</td>
                                                            <td class="p-2.5">${u.role === 'admin' ? 'Administrator' : ('Siswa (' + escapeHtml(u.category || 'instansi') + ')')}</td>
                                                            <td class="p-2.5 font-mono">${escapeHtml(u.username)}</td>
                                                            <td class="p-2.5 font-mono">${escapeHtml(u.password)}</td>
                                                            <td class="p-2.5">
                                                                <button type="button" onclick="deleteUserAccount('${escapeHtml(u.id)}')" class="text-rose-600 font-bold hover:underline">Hapus</button>
                                                            </td>
                                                        </tr>
                                                    `).join('')}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `}
                    </main>
                </div>
            `;
        }

        window.updateUserSearch = function(val) {
            participantSearchQuery = val;
            renderApp();
        };

        window.updateUserFilter = function(val) {
            participantTrackFilter = val;
            renderApp();
        };

        // ==================== 11. RENDER UTAMA & EVENT KEAMANAN ====================
        function renderApp() {
            const root = document.getElementById('app');
            if (!root) return;

            if (!currentUser) {
                root.innerHTML = renderLoginView();
                return;
            }

            if (currentUser.role === 'admin') {
                root.innerHTML = renderAdminDashboardView();
                return;
            }

            if (activeExamSession) {
                root.innerHTML = renderExamRoomView();
                return;
            }

            root.innerHTML = renderStudentDashboardView();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && activeExamSession && currentUser?.role === 'student') {
                recordExamViolation('Berpindah tab atau menyembunyikan jendela ujian');
            } else if (!document.hidden && activeExamSession && currentUser?.role === 'student') {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (!isIOS && !isFullscreenActive()) {
                    showFullscreenLockOverlay('Anda kembali ke halaman ujian. Ketuk tombol di bawah untuk masuk ke mode layar penuh.');
                }
            }
        });

        function handleFullscreenStateChange() {
            if (!activeExamSession || currentUser?.role !== 'student') return;
            if (!isFullscreenActive()) {
                recordExamViolation('Keluar dari mode layar penuh saat ujian');
                showFullscreenLockOverlay('Peringatan! Anda keluar dari mode layar penuh. Pelanggaran dicatat dan layar soal dikunci hingga layar penuh aktif kembali.');
            } else {
                hideFullscreenLockOverlay();
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenStateChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenStateChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenStateChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenStateChange);

        window.addEventListener('resize', () => {
            if (!activeExamSession || currentUser?.role !== 'student') return;
            const folder = (appState.folders || []).find(f => f.id === activeExamSession.folderId);
            if (!folder?.security?.detectSplitScreen) return;
            const currentArea = window.innerWidth * window.innerHeight;
            if (initialViewportArea > 0 && currentArea < initialViewportArea * 0.68) {
                recordExamViolation('Terdeteksi mode split-screen atau penyusutan ukuran layar drastis');
            }
        });

        window.addEventListener('keydown', (e) => {
            if (!activeExamSession || currentUser?.role !== 'student') return;
            const folder = (appState.folders || []).find(f => f.id === activeExamSession.folderId);
            if (!folder?.security?.blockShortcuts) return;

            const isBlocked =
                e.key === 'F12' ||
                e.key === 'PrintScreen' ||
                ((e.ctrlKey || e.metaKey) && ['p', 'P', 's', 'S', 'u', 'U', 'c', 'C', 'v', 'V'].includes(e.key)) ||
                ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'I', 'j', 'J', 'c', 'C'].includes(e.key));

            if (isBlocked) {
                e.preventDefault();
                recordExamViolation('Mencoba menekan tombol pintas terlarang (' + e.key + ')');
            }
        });

        function saveSessionBeforeUnload() {
            if (activeExamSession && currentUser?.role === 'student') {
                const shardKey = `${activeExamSession.folderId}_${activeExamSession.studentId}`;
                appState.liveSessionsMap = appState.liveSessionsMap || {};
                appState.liveSessionsMap[shardKey] = activeExamSession;
                saveLocalMirror();
                enqueueSyncTask('live_' + shardKey, { type: 'live', shardKey, data: activeExamSession });
            }
        }

        window.addEventListener('pagehide', saveSessionBeforeUnload);
        window.addEventListener('beforeunload', saveSessionBeforeUnload);

        window.addEventListener('online', () => {
            updateSyncStatusBadge('Sinyal Kembali — Menyinkronkan ke Cloud...');
            flushPendingSyncQueue();
        });

        window.addEventListener('offline', () => {
            updateSyncStatusBadge('Offline — Jawaban Disimpan Aman di Perangkat');
        });

        async function initCloudAndApp() {
            const localData = loadLocalMirror();
            if (localData) {
                appState = localData;
            }
            renderApp();

            await connectFirebaseRealtime(false);

            try {
                const savedSessRaw = localStorage.getItem(SESSION_KEY);
                if (savedSessRaw) {
                    const parsed = JSON.parse(savedSessRaw);
                    const foundUser = (appState.users || []).find(u => u.id === parsed.userId);
                    if (foundUser) {
                        currentUser = foundUser;
                        if (foundUser.role === 'student') {
                            const liveEntries = getAllLiveSessionsList().filter(s => s.studentId === foundUser.id);
                            if (liveEntries.length > 0) {
                                await resumeInterruptedExamSession(liveEntries[0]);
                                return;
                            }
                        }
                    }
                }
            } catch (_) {}

            renderApp();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCloudAndApp();
            setInterval(() => {
                if (hasAnyPendingQueue() && navigator.onLine) {
                    flushPendingSyncQueue();
                }
            }, 5000);
        });
    </script>
</body>
</html>

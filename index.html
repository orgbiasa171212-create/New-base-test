        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatSeconds(totalSec) {
            const safeSec = Math.max(0, Number(totalSec) || 0);
            const hrs = Math.floor(safeSec / 3600);
            const mins = Math.floor((safeSec % 3600) / 60);
            const secs = safeSec % 60;
            if (hrs > 0) {
                return [hrs, mins, secs].map(n => String(n).padStart(2, '0')).join(':');
            }
            return [mins, secs].map(n => String(n).padStart(2, '0')).join(':');
        }

        function formatDateTimeDisplay(isoOrLocal) {
            if (!isoOrLocal) return 'Fleksibel / Kapan Saja';
            const d = new Date(isoOrLocal);
            if (Number.isNaN(d.getTime())) return String(isoOrLocal);
            return d.toLocaleString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getExamScheduleStatus(folder) {
            const now = Date.now();
            const startMs = folder.scheduleStart ? new Date(folder.scheduleStart).getTime() : null;
            const endMs = folder.scheduleEnd ? new Date(folder.scheduleEnd).getTime() : null;

            if (startMs && !Number.isNaN(startMs) && now < startMs) {
                return { state: 'upcoming', label: 'Belum Dimulai', canStart: false };
            }
            if (endMs && !Number.isNaN(endMs) && now > endMs) {
                return { state: 'closed', label: 'Waktu Berakhir', canStart: false };
            }
            return { state: 'open', label: 'Sedang Dibuka', canStart: true };
        }

                return token;
            } catch (_) {

        function normalizeCloudDoc(raw) {
            const data = raw && typeof raw === 'object' ? raw : {};
            let parsedInProgress = {};
            if (typeof data.inProgressSessions === 'string') {
                try { parsedInProgress = JSON.parse(data.inProgressSessions) || {}; } catch (_) {}
            } else if (data.inProgressSessions && typeof data.inProgressSessions === 'object') {
                parsedInProgress = data.inProgressSessions;
            }

            let parsedLocks = {};
            if (typeof data.activeDeviceLocks === 'string') {
                try { parsedLocks = JSON.parse(data.activeDeviceLocks) || {}; } catch (_) {}
            } else if (data.activeDeviceLocks && typeof data.activeDeviceLocks === 'object') {
                parsedLocks = data.activeDeviceLocks;
            }

            const folders = Array.isArray(data.folders) && data.folders.length > 0
                ? data.folders.map((f, idx) => ({
                    id: f.id || ('folder-' + idx),
                    title: f.title || 'Folder Ujian',
                    subject: f.subject || 'Umum',
                    description: f.description || '',
                    scheduleStart: f.scheduleStart || '',
                    scheduleEnd: f.scheduleEnd || '',
                    durationMinutes: Number(f.durationMinutes) > 0 ? Number(f.durationMinutes) : 30,
                    tokenEnabled: Boolean(f.tokenEnabled),
                    tokenCode: f.tokenCode || 'CBT2026',
                    security: {
                        randomizeQuestions: f.security?.randomizeQuestions !== false,
                        randomizeOptions: f.security?.randomizeOptions !== false,
                        watermarkEnabled: f.security?.watermarkEnabled !== false,
                        periodicSnapshots: f.security?.periodicSnapshots !== false,
                        snapshotIntervalSec: Number(f.security?.snapshotIntervalSec) > 0 ? Number(f.security.snapshotIntervalSec) : 45,
                        blockShortcuts: f.security?.blockShortcuts !== false,
                        detectSplitScreen: f.security?.detectSplitScreen !== false,
                        singleSessionLock: f.security?.singleSessionLock !== false
                    },
                    questions: Array.isArray(f.questions) ? f.questions : []
                }))
                : JSON.parse(JSON.stringify(DEFAULT_STATE.folders));

            const users = Array.isArray(data.users) && data.users.length > 0
                ? data.users
                : JSON.parse(JSON.stringify(DEFAULT_STATE.users));

            const submissions = Array.isArray(data.submissions) ? data.submissions : [];

            if (!folders.some(f => f.id === selectedAdminFolderId)) {
                selectedAdminFolderId = folders[0].id;
            }

            return {
                folders,
                users,
                submissions,
                inProgressSessions: parsedInProgress,
                activeDeviceLocks: parsedLocks
            };
        }

        function saveLocalMirror(stateObj) {

            try {

                if (!raw) return null;

        function getStoredCustomFirebaseConfig() {
            try {
                const raw = localStorage.getItem(CUSTOM_FIREBASE_CONFIG_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object' && parsed.apiKey && parsed.projectId) {
                    return parsed;
                }
                return null;
            } catch (_) {
                return null;
            }
        }

        function resolveFirebaseConfig() {
            const customCfg = getStoredCustomFirebaseConfig();
            if (customCfg) {
                return { config: customCfg, source: 'Kustom (Tersimpan di Browser)' };
            }
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                try {
                    const envCfg = typeof __firebase_config === 'string'
                        ? JSON.parse(__firebase_config)
                        : __firebase_config;
                    if (envCfg && envCfg.apiKey && envCfg.projectId) {
                        return { config: envCfg, source: 'Bawaan Environment' };
                    }
                } catch (_) {
                    // Abaikan jika JSON bawaan tidak valid
                }
            }
            return { config: null, source: 'Belum Dikonfigurasi (Mode Lokal)' };
        }

        function parseFirebaseConfigInput(rawText) {
            const trimmed = (rawText || '').trim();
            if (!trimmed) {
                throw new Error('Konfigurasi Firebase masih kosong.');
            }

            // Coba parsing JSON standar terlebih dahulu
            try {
                const asJson = JSON.parse(trimmed);
                if (asJson && typeof asJson === 'object' && asJson.apiKey && asJson.projectId) {
                    return asJson;
                }
            } catch (_) {
                // Jika bukan JSON murni, lanjut ekstrak dari blok JS `const firebaseConfig = { ... }`
            }

            const objectMatch = trimmed.match(/\{[\s\S]*\}/);
            if (!objectMatch) {
                throw new Error('Format konfigurasi tidak dikenali. Tempelkan objek firebaseConfig atau JSON yang valid.');
            }

            const normalizedJsObj = objectMatch[0]
                .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":')
                .replace(/'/g, '"')
                .replace(/,\s*([}\]])/g, '$1');

            const parsedObj = JSON.parse(normalizedJsObj);
            if (!parsedObj.apiKey || !parsedObj.projectId) {
                throw new Error('Konfigurasi harus memuat minimal "apiKey" dan "projectId".');
            }

            return parsedObj;
        }

        window.saveFirebaseConfigFromUI = async function(e) {
            e.preventDefault();
            const rawText = document.getElementById('firebaseConfigTextarea').value;
            const errEl = document.getElementById('firebaseConfigError');

            try {
                const parsedCfg = parseFirebaseConfigInput(rawText);
                localStorage.setItem(CUSTOM_FIREBASE_CONFIG_KEY, JSON.stringify(parsedCfg));
                if (errEl) errEl.classList.add('hidden');
                closeDynamicModal();
                await connectFirebaseRealtime(true);
                renderApp();
                showModalMessage(
                    'Terhubung ke Firebase Cloud',
                    'Aplikasi berhasil tersambung ke proyek Firebase "' + parsedCfg.projectId + '". Data akan disinkronkan secara real-time.',
                    'success'
                );
            } catch (err) {
                if (errEl) {
                    errEl.textContent = err.message || 'Konfigurasi Firebase tidak valid.';
                    errEl.classList.remove('hidden');
                }
            }
        };

        window.clearCustomFirebaseConfig = async function() {
            localStorage.removeItem(CUSTOM_FIREBASE_CONFIG_KEY);
            closeDynamicModal();
            await connectFirebaseRealtime(true);
            renderApp();
            showModalMessage(

        async function persistCloudState() {
            saveLocalMirror(appState);

            if (!db || !cloudConnectedLive) {
                updateSyncStatusBadge('Tersimpan Lokal');
                return;
            }

            try {
                updateSyncStatusBadge('Menyimpan ke Cloud...');
                const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cbt_state', 'master');
                await setDoc(stateDocRef, {
                    folders: appState.folders,
                    users: appState.users,
                    submissions: appState.submissions,
                    inProgressSessions: JSON.stringify(appState.inProgressSessions || {}),
                    activeDeviceLocks: JSON.stringify(appState.activeDeviceLocks || {}),
                    updatedAt: new Date().toISOString()
                });
                updateSyncStatusBadge('Cloud Tersinkronisasi');
            } catch (err) {
                console.warn('Gagal menyimpan ke Firestore:', err);
                updateSyncStatusBadge('Tersimpan Lokal (Sinkronisasi Tertunda)');
            }
        }

            if (!fullName || !username || !password) {
                if (errEl) {

                    errEl.classList.remove('hidden');
                }
                return;
            }

            const usernameTaken = appState.users.some(u => u.username.toLowerCase() === username.toLowerCase());
            if (usernameTaken) {
                if (errEl) {
                    errEl.textContent = 'Username tersebut sudah digunakan. Silakan pilih username lain.';
                    errEl.classList.remove('hidden');

                password,

        window.handleLogin = async function(e) {
            e.preventDefault();
            const username = (document.getElementById('loginUsername')?.value || '').trim();
            const password = (document.getElementById('loginPassword')?.value || '').trim();
            const errEl = document.getElementById('loginErrorMsg');

            const matched = appState.users.find(u =>
                u.role === loginRole &&
                u.username.toLowerCase() === username.toLowerCase() &&
                u.password === password
            );

            if (!matched) {
                if (errEl) {
                    errEl.textContent = 'Username atau password tidak sesuai untuk peran yang dipilih.';
                    errEl.classList.remove('hidden');
                }
                return;
            }

            currentUser = matched;
            activeMenu = 'ujian';
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));

            if (currentUser.role === 'student') {
                const devToken = getOrCreateDeviceToken();
                appState.activeDeviceLocks = appState.activeDeviceLocks || {};
                appState.activeDeviceLocks[currentUser.id] = devToken;
                await persistCloudState();

                if (appState.inProgressSessions && appState.inProgressSessions[currentUser.id]) {
                    await resumeInterruptedExamSession(appState.inProgressSessions[currentUser.id]);
                    return;
                }
            }

            renderApp();
        };

        window.handleLogout = async function() {
            stopExamProctoring();
            if (currentUser && currentUser.role === 'student' && appState.activeDeviceLocks && appState.activeDeviceLocks[currentUser.id]) {
                delete appState.activeDeviceLocks[currentUser.id];
                await persistCloudState();
            }
            currentUser = null;
            activeExamSession = null;
            localStorage.removeItem(SESSION_KEY);
            renderApp();
        };

        window.createExamFolder = async function(e) {

            const title = (document.getElementById('newFolderTitle')?.value || '').trim();
            const subject = (document.getElementById('newFolderSubject')?.value || '').trim();
            const description = (document.getElementById('newFolderDesc')?.value || '').trim();

            const scheduleStart = document.getElementById('newFolderStart')?.value || '';
            const scheduleEnd = document.getElementById('newFolderEnd')?.value || '';
            const tokenEnabled = Boolean(document.getElementById('newFolderTokenEnabled')?.checked);
            const tokenCode = ((document.getElementById('newFolderTokenCode')?.value || '').trim() || 'CBT' + Math.floor(1000 + Math.random() * 9000)).toUpperCase();

            if (!title) return;

            const newFolder = {
                id: 'folder-' + Date.now(),
                title,
                subject: subject || 'Umum',
                description,
                scheduleStart,
                scheduleEnd,
                durationMinutes,
                tokenEnabled,
                tokenCode,
                security: {

                    randomizeOptions: true,

                    periodicSnapshots: true,
                    snapshotIntervalSec: 45,

                questions: []

            appState.folders.push(newFolder);
            selectedAdminFolderId = newFolder.id;
            await persistCloudState();
            renderApp();
            showModalMessage('Folder Ujian Dibuat', 'Folder "' + title + '" berhasil ditambahkan dan tersimpan ke cloud.', 'success');

            folder.scheduleStart = document.getElementById('editFolderStart')?.value || '';
            folder.scheduleEnd = document.getElementById('editFolderEnd')?.value || '';
            folder.tokenEnabled = Boolean(document.getElementById('editFolderTokenEnabled')?.checked);
            folder.tokenCode = ((document.getElementById('editFolderTokenCode')?.value || '').trim() || folder.tokenCode || 'CBT2026').toUpperCase();

            folder.security = {

                return;

            appState.folders = appState.folders.filter(f => f.id !== folderId);

            await persistCloudState();
            renderApp();
            showModalMessage('Folder Dihapus', 'Folder ujian telah dihapus.', 'info');

        window.addQuestionToFolder = async function(e) {
            e.preventDefault();
            if (!isCurrentUserAdmin()) return;
            const folder = getSelectedAdminFolder();
            if (!folder) return;

            const type = document.getElementById('newQType')?.value || 'pg';
            const text = (document.getElementById('newQText')?.value || '').trim();
            const points = Math.max(1, Number(document.getElementById('newQPoints')?.value) || 10);

            if (!text) return;

            let options = [];
            let correctOption = 0;
            let correctOptions = [];

            if (type === 'pg' || type === 'pg_kompleks') {
                const rawOpts = [
                    document.getElementById('newQOpt0')?.value || '',
                    document.getElementById('newQOpt1')?.value || '',
                    document.getElementById('newQOpt2')?.value || '',
                    document.getElementById('newQOpt3')?.value || ''
                ].map(s => s.trim()).filter(Boolean);

                if (rawOpts.length < 2) {
                    showModalMessage('Opsi Belum Lengkap', 'Isi minimal 2 pilihan jawaban untuk soal pilihan ganda.', 'warning');
                    return;
                }
                options = rawOpts;

                if (type === 'pg') {
                    const picked = Number(document.getElementById('newQCorrectSingle')?.value || 0);
                    correctOption = picked < options.length ? picked : 0;
                    correctOptions = [correctOption];
                } else {
                    const checks = [0, 1, 2, 3].filter(idx => idx < options.length && document.getElementById('newQCorrectMulti' + idx)?.checked);
                    correctOptions = checks.length > 0 ? checks : [0];
                    correctOption = correctOptions[0];
                }
            }

            folder.questions.push({
                id: 'q-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                type,
                text,
                options,
                correctOption,
                correctOptions,
                points

        window.updateEssayScore = async function(submissionId, questionId, rawScore) {
            if (!isCurrentUserAdmin()) return;
            const sub = appState.submissions.find(s => s.id === submissionId);
            if (!sub) return;
            const qItem = (sub.reviewItems || []).find(item => item.questionId === questionId);
            if (!qItem) return;

            const maxPts = Number(qItem.maxPoints) || 0;
            const clamped = Math.max(0, Math.min(maxPts, Number(rawScore) || 0));
            qItem.awardedPoints = clamped;

            const autoSum = (sub.reviewItems || [])
                .filter(i => i.type !== 'uraian')
                .reduce((acc, i) => acc + (Number(i.awardedPoints) || 0), 0);
            const essaySum = (sub.reviewItems || [])
                .filter(i => i.type === 'uraian')
                .reduce((acc, i) => acc + (Number(i.awardedPoints) || 0), 0);

            sub.autoScore = autoSum;
            sub.essayScore = essaySum;
            sub.totalScore = autoSum + essaySum;

            await persistCloudState();
            renderApp();
        };

        function shuffleArray(arr) {
            const copy = arr.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function buildOrderedQuestionsForFolder(folder) {
            const baseQs = Array.isArray(folder.questions) ? folder.questions : [];
            const qList = folder.security?.randomizeQuestions ? shuffleArray(baseQs) : baseQs.slice();

            return qList.map(q => {
                if (q.type === 'uraian' || !Array.isArray(q.options) || q.options.length === 0) {
                    return {
                        ...q,
                        displayOptions: [],
                        correctDisplayIndices: []
                    };
                }

                const indexed = q.options.map((optText, origIdx) => ({ optText, origIdx }));
                const orderedOpts = folder.security?.randomizeOptions ? shuffleArray(indexed) : indexed;
                const origCorrectSet = new Set(
                    Array.isArray(q.correctOptions) && q.correctOptions.length > 0
                        ? q.correctOptions
                        : [Number(q.correctOption) || 0]
                );

                const correctDisplayIndices = [];
                orderedOpts.forEach((item, dispIdx) => {
                    if (origCorrectSet.has(item.origIdx)) {
                        correctDisplayIndices.push(dispIdx);
                    }
                });

                return {
                    ...q,
                    displayOptions: orderedOpts.map(o => o.optText),
                    correctDisplayIndices
                };
            });
        }

        window.startExamFromFolder = async function(folderId) {
            if (!currentUser || currentUser.role !== 'student') return;
            const folder = appState.folders.find(f => f.id === folderId);

            const sched = getExamScheduleStatus(folder);

                showModalMessage('Jadwal Ujian', 'Folder ujian ini belum dibuka atau sudah berakhir (' + sched.label + ').', 'warning');
                return;
            }

            if (folder.tokenEnabled) {
                const tokenInput = document.getElementById('tokenInput_' + folderId);
                const enteredToken = (tokenInput?.value || '').trim().toUpperCase();
                if (!enteredToken || enteredToken !== String(folder.tokenCode || '').trim().toUpperCase()) {
                    showModalMessage('Token Tidak Valid', 'Masukkan kode token ujian yang benar untuk membuka folder ini.', 'warning');
                    return;

        function captureCameraSnapshotNow() {
            if (!activeExamSession || !activeExamSession.security?.periodicSnapshots) return;
            const videoEl = document.getElementById('proctorCameraVideo');
            if (!videoEl || videoEl.readyState < 2) return;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 240;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.65);

                activeExamSession.snapshots = activeExamSession.snapshots || [];
                if (activeExamSession.snapshots.length < 18) {
                    activeExamSession.snapshots.push({
                        imageData,
                        capturedAtLabel: new Date().toLocaleTimeString('id-ID')
                    });
                }
            } catch (_) {
                // Abaikan jika snapshot gagal diambil
            }
        }

        async function recordExamViolation(reasonText) {
            if (!activeExamSession) return;
            activeExamSession.violations = (Number(activeExamSession.violations) || 0) + 1;
            await syncActiveSessionToCloud();
            const badge = document.getElementById('liveViolationCounter');
            if (badge) {

            console.warn('Pelanggaran ujian tercatat:', reasonText);
        }

        function stopExamProctoring() {
            if (examTimerInterval) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
            }
            if (snapshotIntervalTimer) {
                clearInterval(snapshotIntervalTimer);
                snapshotIntervalTimer = null;
            }
            if (cameraStream) {
                try {
                    cameraStream.getTracks().forEach(t => t.stop());
                } catch (_) {}
                cameraStream = null;
            }
        }

        function startExamProctoring() {
            stopExamProctoring();
            if (!activeExamSession) return;

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                    .then(stream => {
                        cameraStream = stream;
                        const vid = document.getElementById('proctorCameraVideo');
                        if (vid) vid.srcObject = stream;
                    })
                    .catch(() => {
                        // Kamera opsional bila ditolak pengguna
                    });
            }

            if (activeExamSession.security?.periodicSnapshots) {
                const intervalMs = Math.max(15, Number(activeExamSession.security.snapshotIntervalSec) || 45) * 1000;
                snapshotIntervalTimer = setInterval(() => {
                    captureCameraSnapshotNow();
                }, intervalMs);
            }

            examTimerInterval = setInterval(async () => {
                if (!activeExamSession) return;
                activeExamSession.remainingSeconds = Math.max(0, (Number(activeExamSession.remainingSeconds) || 0) - 1);
                const timerEl = document.getElementById('examCountdownDisplay');
                if (timerEl) {
                    timerEl.textContent = formatSeconds(activeExamSession.remainingSeconds);
                }

                if (activeExamSession.remainingSeconds % 10 === 0) {
                    await syncActiveSessionToCloud();
                }

                if (activeExamSession.remainingSeconds <= 0) {
                    await submitActiveExam('Waktu Ujian Habis');
                }
            }, 1000);
        }

        async function finalizeExamSubmission(sessionObj, submitReason = 'Selesai') {
            captureCameraSnapshotNow();

            const qs = Array.isArray(sessionObj.orderedQuestions) ? sessionObj.orderedQuestions : [];
            let autoScore = 0;
            let maxTotalScore = 0;
            const reviewItems = [];

            qs.forEach(q => {
                const pts = Number(q.points) || 0;
                maxTotalScore += pts;
                const ans = sessionObj.answers?.[q.id];

                if (q.type === 'pg') {
                    const expected = Array.isArray(q.correctDisplayIndices) && q.correctDisplayIndices.length > 0
                        ? q.correctDisplayIndices[0]
                        : 0;
                    const isCorrect = Number(ans) === Number(expected);
                    const awarded = isCorrect ? pts : 0;
                    autoScore += awarded;
                    reviewItems.push({
                        questionId: q.id,
                        type: q.type,
                        questionText: q.text,
                        maxPoints: pts,
                        awardedPoints: awarded,
                        studentAnswerText: typeof ans === 'number' && q.displayOptions?.[ans] !== undefined
                            ? q.displayOptions[ans]
                            : '(Belum dijawab)'
                    });
                } else if (q.type === 'pg_kompleks') {
                    const expectedArr = Array.isArray(q.correctDisplayIndices) ? q.correctDisplayIndices.slice().sort() : [];
                    const givenArr = Array.isArray(ans) ? ans.slice().sort() : [];
                    const isExact = expectedArr.length > 0 &&
                        expectedArr.length === givenArr.length &&
                        expectedArr.every((v, idx) => v === givenArr[idx]);
                    const awarded = isExact ? pts : 0;
                    autoScore += awarded;
                    reviewItems.push({
                        questionId: q.id,
                        type: q.type,
                        questionText: q.text,
                        maxPoints: pts,
                        awardedPoints: awarded,
                        studentAnswerText: givenArr.length > 0
                            ? givenArr.map(i => q.displayOptions?.[i]).filter(Boolean).join(', ')
                            : '(Belum dijawab)'
                    });
                } else {
                    reviewItems.push({
                        questionId: q.id,
                        type: 'uraian',
                        questionText: q.text,
                        maxPoints: pts,
                        awardedPoints: 0,
                        studentAnswerText: typeof ans === 'string' && ans.trim() ? ans.trim() : '(Belum dijawab)'
                    });
                }
            });

            const submissionRecord = {
                id: 'sub-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                userId: sessionObj.studentId,
                studentName: sessionObj.studentName,
                username: sessionObj.username,
                folderId: sessionObj.folderId,
                folderTitle: sessionObj.folderTitle,
                submittedAt: new Date().toISOString(),
                submitReason,
                violations: Number(sessionObj.violations) || 0,
                autoScore,
                essayScore: 0,
                totalScore: autoScore,
                maxTotalScore,
                reviewItems,
                snapshots: Array.isArray(sessionObj.snapshots) ? sessionObj.snapshots : []
            };

            appState.submissions.unshift(submissionRecord);
            if (appState.inProgressSessions && appState.inProgressSessions[sessionObj.studentId]) {
                delete appState.inProgressSessions[sessionObj.studentId];
            }

            if (currentUser && currentUser.id === sessionObj.studentId) {
                activeExamSession = null;
                activeMenu = 'nilai';
            }

            await persistCloudState();
        }

        async function connectFirebaseRealtime(uploadCurrentLocalStateIfEmpty = false) {
            if (unsubscribeCloud) {
                try { unsubscribeCloud(); } catch (_) {}
                unsubscribeCloud = null;
            }
            cloudConnectedLive = false;
            db = null;
            auth = null;
            authUser = null;

            const { config } = resolveFirebaseConfig();
            if (!config) {
                activeFirebaseProjectId = '-';
                updateSyncStatusBadge('Penyimpanan Lokal Aktif');
                return;
            }

            activeFirebaseProjectId = config.projectId || '-';

            try {
                updateSyncStatusBadge('Menghubungkan ke Firebase...');
                const appName = 'nbt_app_' + (config.projectId || 'default') + '_' + Math.random().toString(36).slice(2, 7);
                const fbApp = initializeApp(config, appName);
                auth = getAuth(fbApp);
                db = getFirestore(fbApp);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    authUser = cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    authUser = cred.user;
                }

                const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cbt_state', 'master');
                const snap = await getDoc(stateDocRef);
                if (!snap.exists()) {
                    await setDoc(stateDocRef, {
                        folders: appState.folders,
                        users: appState.users,
                        submissions: appState.submissions,
                        inProgressSessions: JSON.stringify(appState.inProgressSessions || {}),
                        activeDeviceLocks: JSON.stringify(appState.activeDeviceLocks || {}),
                        updatedAt: new Date().toISOString()
                    });
                } else if (uploadCurrentLocalStateIfEmpty) {
                    const remoteNormalized = normalizeCloudDoc(snap.data());
                    const hasRemoteData = Array.isArray(remoteNormalized.folders) && remoteNormalized.folders.length > 0;
                    if (!hasRemoteData) {
                        await persistCloudState();
                    } else {
                        appState = remoteNormalized;
                        saveLocalMirror(appState);
                    }
                }

                cloudConnectedLive = true;
                updateSyncStatusBadge('Cloud Tersinkronisasi');

                unsubscribeCloud = onSnapshot(stateDocRef, (docSnap) => {
                    if (!docSnap.exists() || isRemoteUpdating) return;
                    isRemoteUpdating = true;
                    try {
                        appState = normalizeCloudDoc(docSnap.data());
                        saveLocalMirror(appState);

                        if (currentUser) {
                            const updatedCurrent = appState.users.find(u => u.id === currentUser.id);
                            if (updatedCurrent) {
                                currentUser = updatedCurrent;
                                localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));

                                // Cek sesi tunggal (anti-login ganda dari perangkat berbeda)
                                if (currentUser.role === 'student' && appState.activeDeviceLocks && appState.activeDeviceLocks[currentUser.id]) {
                                    const myDeviceToken = getOrCreateDeviceToken();
                                    if (appState.activeDeviceLocks[currentUser.id] !== myDeviceToken) {
                                        handleLogout();
                                        showModalMessage('Sesi Dialihkan', 'Akun Anda baru saja login di perangkat lain. Sesi pada perangkat ini ditutup otomatis.', 'warning');
                                        return;
                                    }
                                }

                                // Jika sesi ujian sedang berlangsung dikunci/dikumpulkan paksa oleh Admin dari jauh
                                if (currentUser.role === 'student' && activeExamSession && !appState.inProgressSessions[currentUser.id]) {
                                    stopExamProctoring();
                                    activeExamSession = null;
                                    activeMenu = 'nilai';
                                    renderApp();
                                    showModalMessage('Ujian Dikumpulkan Admin', 'Sesi ujian Anda telah dikunci dan dikumpulkan oleh Administrator.', 'warning');
                                    return;
                                }

                                if (currentUser.role === 'student' && !activeExamSession && appState.inProgressSessions[currentUser.id]) {
                                    resumeInterruptedExamSession(appState.inProgressSessions[currentUser.id]);
                                }
                            } else {
                                handleLogout();
                                return;
                            }
                        }
                        cloudConnectedLive = true;
                        updateSyncStatusBadge('Cloud Tersinkronisasi');
                        renderApp();
                    } finally {
                        isRemoteUpdating = false;
                    }
                }, (err) => {
                    console.warn('Listener Firestore terputus:', err);
                    cloudConnectedLive = false;
                    updateSyncStatusBadge('Tersimpan Lokal (Mode Offline)');
                });
            } catch (err) {
                console.warn('Gagal menyambung ke Firebase Firestore:', err);
                cloudConnectedLive = false;
                updateSyncStatusBadge('Tersimpan Lokal (Cek Config/Rules Firebase)');
            }
        }

        async function initCloudAndApp() {
            const localCached = loadLocalMirror();
            if (localCached) {
                appState = localCached;
            }

            try {
                const rawSession = localStorage.getItem(SESSION_KEY);
                if (rawSession) {
                    const parsedUser = JSON.parse(rawSession);
                    const freshUser = appState.users.find(u => u.id === parsedUser.id);
                    if (freshUser) {
                        currentUser = freshUser;
                        if (currentUser.role === 'student' && appState.inProgressSessions[currentUser.id]) {
                            await resumeInterruptedExamSession(appState.inProgressSessions[currentUser.id]);
                        }
                    } else {
                        localStorage.removeItem(SESSION_KEY);
                    }
                }
            } catch (_) {
                localStorage.removeItem(SESSION_KEY);
            }

            renderApp();
            await connectFirebaseRealtime(false);
            renderApp();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCloudAndApp();
        });
    </script>
</body>
</html>

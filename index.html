<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Base Test — Sistem Ujian CBT & Pengawasan Keamanan Tinggi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        input, textarea, select {
            user-select: text;
            -webkit-user-select: text;
        }
        .mirror-video {
            transform: scaleX(-1);
        }
        @keyframes pulseRec {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }
        .pulse-rec {
            animation: pulseRec 1.5s infinite;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col" oncontextmenu="return false;">

    <!-- ROOT APPLICATION MOUNT -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- GLOBAL NOTIFICATION / CONFIRMATION MODAL -->
    <div id="globalModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
            <div id="gModalIcon" class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center text-2xl mb-4 mx-auto">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="gModalTitle" class="text-lg font-extrabold text-center text-slate-900 mb-2">Informasi Sistem</h3>
            <p id="gModalMessage" class="text-slate-600 text-center text-sm leading-relaxed mb-6">Pesan sistem...</p>
            <div id="gModalActions" class="flex justify-center gap-3">
                <button onclick="closeGlobalModal()" class="w-full py-2.5 px-5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm rounded-xl transition shadow-sm">
                    Mengerti
                </button>
            </div>
        </div>
    </div>

    <!-- DYNAMIC FORM / DETAIL MODAL -->
    <div id="dynamicModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div id="dynamicModalBody" class="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto"></div>
    </div>

    <script>
        // =========================================================================
        // 1. DATABASE & STORAGE INITIALIZATION (localStorage)
        // =========================================================================
        const STORAGE_KEYS = {
            USERS: 'nbt_v3_users',
            QUESTIONS: 'nbt_v3_questions',
            SETTINGS: 'nbt_v3_settings',
            RESULTS: 'nbt_v3_results',
            VIOLATIONS: 'nbt_v3_violations',
            SESSION: 'nbt_v3_session'
        };

        const DEFAULT_USERS = [
            { id: 'u_admin', username: 'admin', password: 'admin123', role: 'admin', track: 'instansi', name: 'Administrator Utama', institution: 'Pusat New Base Test' },
            { id: 'u_s1', username: 'siswa01', password: '123456', role: 'student', track: 'instansi', name: 'Ahmad Fauzi', institution: 'SMA Negeri 1 Semarang' },
            { id: 'u_m1', username: 'mandiri01', password: '123456', role: 'student', track: 'mandiri', name: 'Nadia Putri', institution: 'Peserta Mandiri Umum' }
        ];

        const DEFAULT_QUESTIONS = [
            {
                id: 'q1',
                type: 'single',
                question: 'Protokol keamanan web yang mengenkripsi lalu lintas data antara browser klien dan server menggunakan sertifikat SSL/TLS adalah...',
                options: ['HTTP', 'FTP', 'HTTPS', 'SMTP'],
                correct: [2],
                points: 20
            },
            {
                id: 'q2',
                type: 'complex',
                question: 'Pilih semua komponen utama yang termasuk dalam arsitektur database skala besar untuk menangani trafik tinggi (High Concurrency):',
                options: ['In-Memory Cache (Redis)', 'Load Balancer', 'Kabel VGA Monitor', 'Database Read-Replica'],
                correct: [0, 1, 3],
                points: 30
            },
            {
                id: 'q3',
                type: 'essay',
                question: 'Jelaskan mengapa pengawasan kamera (proctoring) dan pembatasan perpindahan tab penting diterapkan pada ujian daring skala besar!',
                options: [],
                correct: [],
                points: 50
            }
        ];

        function getDefaultSchedule() {
            const now = new Date();
            const start = new Date(now.getTime() - 3600 * 1000); // 1 jam lalu
            const end = new Date(now.getTime() + 7 * 24 * 3600 * 1000); // 7 hari ke depan
            const fmt = (d) => {
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };
            return { startStr: fmt(start), endStr: fmt(end) };
        }

        function initDB() {
            if (!localStorage.getItem(STORAGE_KEYS.USERS)) {
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(DEFAULT_USERS));
            }
            if (!localStorage.getItem(STORAGE_KEYS.QUESTIONS)) {
                localStorage.setItem(STORAGE_KEYS.QUESTIONS, JSON.stringify(DEFAULT_QUESTIONS));
            }
            if (!localStorage.getItem(STORAGE_KEYS.SETTINGS)) {
                const sched = getDefaultSchedule();
                localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify({
                    examTitle: 'Asesmen Kompetensi Nasional — New Base Test',
                    startDateTime: sched.startStr,
                    endDateTime: sched.endStr,
                    useTimer: true,
                    durationMinutes: 60,
                    requireCamera: true,
                    requireFullscreen: true,
                    maxViolations: 3
                }));
            }
            if (!localStorage.getItem(STORAGE_KEYS.RESULTS)) {
                localStorage.setItem(STORAGE_KEYS.RESULTS, JSON.stringify([]));
            }
            if (!localStorage.getItem(STORAGE_KEYS.VIOLATIONS)) {
                localStorage.setItem(STORAGE_KEYS.VIOLATIONS, JSON.stringify([]));
            }
        }
        initDB();

        // Data Access Helpers
        const db = {
            getUsers: () => JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]'),
            saveUsers: (u) => localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(u)),
            getQuestions: () => JSON.parse(localStorage.getItem(STORAGE_KEYS.QUESTIONS) || '[]'),
            saveQuestions: (q) => localStorage.setItem(STORAGE_KEYS.QUESTIONS, JSON.stringify(q)),
            getSettings: () => JSON.parse(localStorage.getItem(STORAGE_KEYS.SETTINGS)),
            saveSettings: (s) => localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(s)),
            getResults: () => JSON.parse(localStorage.getItem(STORAGE_KEYS.RESULTS) || '[]'),
            saveResults: (r) => localStorage.setItem(STORAGE_KEYS.RESULTS, JSON.stringify(r)),
            getViolations: () => JSON.parse(localStorage.getItem(STORAGE_KEYS.VIOLATIONS) || '[]'),
            saveViolations: (v) => localStorage.setItem(STORAGE_KEYS.VIOLATIONS, JSON.stringify(v)),
            getSession: () => JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION) || 'null'),
            setSession: (s) => {
                localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(s));
                renderApp();
            }
        };

        // =========================================================================
        // 2. APPLICATION STATE & PROCTORING RUNTIME
        // =========================================================================
        let uiState = {
            loginRole: 'student', // 'student' | 'admin'
            loginTrack: 'instansi', // 'instansi' | 'mandiri'
            activeMenu: 'ujian', // 'ujian' | 'nilai' | 'profil'
            adminSubTab: 'schedule' // 'schedule' | 'questions' | 'logs'
        };

        let examRuntime = {
            isActive: false,
            currentIndex: 0,
            answers: {},
            secondsRemaining: 0,
            timerId: null,
            violations: 0,
            mediaStream: null,
            cameraReady: false,
            cameraSimulated: false
        };

        // Format Indonesian Date & Day
        function formatIndoDateTime(isoStr) {
            if (!isoStr) return '-';
            const d = new Date(isoStr);
            if (isNaN(d.getTime())) return isoStr;
            return d.toLocaleDateString('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }) + ' WIB';
        }

        function getScheduleStatus(settings) {
            const now = new Date();
            const start = new Date(settings.startDateTime);
            const end = new Date(settings.endDateTime);
            if (now < start) return { code: 'UPCOMING', label: 'Belum Dimulai', color: 'amber' };
            if (now > end) return { code: 'CLOSED', label: 'Waktu Ujian Berakhir', color: 'rose' };
            return { code: 'ACTIVE', label: 'Sedang Berlangsung (Dibuka)', color: 'emerald' };
        }

        // =========================================================================
        // 3. MAIN ROUTER & LAYOUT RENDERER
        // =========================================================================
        function renderApp() {
            const session = db.getSession();
            const app = document.getElementById('app');

            if (!session) {
                app.innerHTML = renderLoginView();
                return;
            }

            // Refresh session data from DB in case admin updated it
            const freshUser = db.getUsers().find(u => u.id === session.id) || session;

            app.innerHTML = `
                <div class="min-h-screen flex flex-col md:flex-row bg-slate-100">
                    <!-- IDENTICAL SIDEBAR FOR BOTH ADMIN & PARTICIPANT -->
                    <aside class="w-full md:w-72 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0 shadow-2xl z-20">
                        <div>
                            <!-- Brand Header -->
                            <div class="p-6 border-b border-slate-800 flex items-center gap-3.5">
                                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center text-xl shadow-lg shadow-blue-600/30">
                                    <i class="fa-solid fa-shield-halved"></i>
                                </div>
                                <div>
                                    <h1 class="font-extrabold text-white text-lg tracking-tight leading-none">New Base Test</h1>
                                    <span class="text-[11px] font-semibold text-blue-400 tracking-wide">CBT & AI Proctoring</span>
                                </div>
                            </div>

                            <!-- User Badge -->
                            <div class="p-4 mx-4 mt-4 rounded-2xl bg-slate-800/70 border border-slate-700/70">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 text-blue-400 flex items-center justify-center font-bold text-base shrink-0">
                                        ${freshUser.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="min-w-0">
                                        <p class="text-sm font-bold text-white truncate">${freshUser.name}</p>
                                        <div class="flex items-center gap-1.5 mt-0.5">
                                            <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-wider ${freshUser.role === 'admin' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}">
                                                ${freshUser.role === 'admin' ? 'Administrator' : (freshUser.track === 'instansi' ? 'Instansi Sekolah' : 'Mandiri')}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 3 UNIFIED SIDEBAR MENUS: UJIAN, NILAI, PROFIL -->
                            <nav class="p-4 space-y-1.5 mt-2">
                                <p class="px-3 text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2">Menu Navigasi Utama</p>
                                
                                <button onclick="navigateMenu('ujian')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-bold text-sm transition ${uiState.activeMenu === 'ujian' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                                    <i class="fa-solid fa-laptop-file w-5 text-center text-base"></i>
                                    <span>Ujian</span>
                                </button>

                                <button onclick="navigateMenu('nilai')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-bold text-sm transition ${uiState.activeMenu === 'nilai' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                                    <i class="fa-solid fa-square-poll-vertical w-5 text-center text-base"></i>
                                    <span>Nilai</span>
                                </button>

                                <button onclick="navigateMenu('profil')" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-bold text-sm transition ${uiState.activeMenu === 'profil' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                                    <i class="fa-solid fa-id-card-clip w-5 text-center text-base"></i>
                                    <span>Profil</span>
                                </button>
                            </nav>
                        </div>

                        <!-- Logout Footer -->
                        <div class="p-4 border-t border-slate-800">
                            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/20 font-bold text-xs transition">
                                <i class="fa-solid fa-right-from-bracket"></i> Keluar dari Sistem
                            </button>
                        </div>
                    </aside>

                    <!-- MAIN WORKSPACE -->
                    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
                        <!-- Topbar -->
                        <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-10">
                            <div class="flex items-center gap-3">
                                <span class="w-3 h-3 rounded-full bg-blue-600"></span>
                                <h2 class="text-lg md:text-xl font-extrabold text-slate-900">
                                    ${getHeaderTitle(freshUser.role, uiState.activeMenu)}
                                </h2>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-semibold px-3.5 py-1.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                                    <i class="fa-regular fa-calendar-check text-blue-600 mr-1.5"></i>
                                    ${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                </span>
                            </div>
                        </header>

                        <!-- Page Body -->
                        <div class="p-6 md:p-8 flex-1">
                            ${renderActivePage(freshUser)}
                        </div>
                    </main>
                </div>
            `;

            // Attach active proctoring video stream if exam is running
            if (freshUser.role === 'student' && uiState.activeMenu === 'ujian' && examRuntime.isActive) {
                attachActiveExamCamera();
            }
        }

        function getHeaderTitle(role, menu) {
            if (role === 'admin') {
                if (menu === 'ujian') return 'Ujian — Jadwal, Bank Soal & Pengawasan';
                if (menu === 'nilai') return 'Nilai — Rekapitulasi & Koreksi Uraian';
                if (menu === 'profil') return 'Profil — Administrator & Manajemen Akun';
            } else {
                if (menu === 'ujian') return 'Ujian — Ruang Ujian Terawas';
                if (menu === 'nilai') return 'Nilai — Hasil & Transkrip Ujian';
                if (menu === 'profil') return 'Profil — Identitas Peserta';
            }
            return 'New Base Test';
        }

        function navigateMenu(menu) {
            if (examRuntime.isActive) {
                showGlobalModal('Akses Dikunci', 'Anda sedang dalam sesi ujian aktif! Selesaikan dan kirim jawaban terlebih dahulu sebelum berpindah menu.', 'warning');
                return;
            }
            uiState.activeMenu = menu;
            renderApp();
        }

        // =========================================================================
        // 4. LOGIN VIEW & AUTHENTICATION
        // =========================================================================
        function renderLoginView() {
            const isStudent = uiState.loginRole === 'student';
            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900">
                    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
                        <!-- Header -->
                        <div class="bg-gradient-to-r from-blue-700 to-indigo-700 p-7 text-white text-center relative">
                            <div class="w-16 h-16 bg-white/15 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-xs border border-white/25 shadow-lg">
                                <i class="fa-solid fa-shield-halved text-3xl"></i>
                            </div>
                            <h1 class="text-2xl font-extrabold tracking-tight">New Base Test</h1>
                            <p class="text-blue-100 text-xs mt-1 font-medium">Sistem Ujian Skala Besar & Pengawasan Kamera</p>
                        </div>

                        <div class="p-6 md:p-8">
                            <!-- Role Switcher -->
                            <div class="grid grid-cols-2 gap-1.5 p-1.5 bg-slate-100 rounded-2xl mb-5">
                                <button type="button" onclick="setLoginRole('student')" class="py-2.5 text-xs font-extrabold rounded-xl transition flex items-center justify-center gap-2 ${isStudent ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}">
                                    <i class="fa-solid fa-user-graduate"></i> Peserta Ujian
                                </button>
                                <button type="button" onclick="setLoginRole('admin')" class="py-2.5 text-xs font-extrabold rounded-xl transition flex items-center justify-center gap-2 ${!isStudent ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}">
                                    <i class="fa-solid fa-user-shield"></i> Administrator
                                </button>
                            </div>

                            <!-- Track Selector (Student Only) -->
                            ${isStudent ? `
                                <div class="mb-5">
                                    <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2">Pilih Jalur Kepesertaan</label>
                                    <div class="grid grid-cols-2 gap-2.5">
                                        <button type="button" onclick="setLoginTrack('instansi')" class="py-2.5 px-3 rounded-xl border-2 text-xs font-bold flex items-center justify-center gap-2 transition ${uiState.loginTrack === 'instansi' ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">
                                            <i class="fa-solid fa-school"></i> Instansi Sekolah
                                        </button>
                                        <button type="button" onclick="setLoginTrack('mandiri')" class="py-2.5 px-3 rounded-xl border-2 text-xs font-bold flex items-center justify-center gap-2 transition ${uiState.loginTrack === 'mandiri' ? 'border-emerald-600 bg-emerald-50 text-emerald-700' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}">
                                            <i class="fa-solid fa-user-check"></i> Mandiri / Sendiri
                                        </button>
                                    </div>
                                </div>
                            ` : `
                                <div class="mb-5 p-3 rounded-xl bg-indigo-50 border border-indigo-100 text-indigo-800 text-xs flex items-center gap-2.5">
                                    <i class="fa-solid fa-lock text-indigo-600"></i>
                                    <span>Mode akses penuh Administrator untuk pengelolaan jadwal, soal, dan akun.</span>
                                </div>
                            `}

                            <!-- Login Form -->
                            <form onsubmit="processLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Username</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                                        <input type="text" id="inputUsername" required placeholder="Masukkan username..." class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition">
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                                        <input type="password" id="inputPassword" required placeholder="Masukkan password..." class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition">
                                    </div>
                                </div>

                                <div id="loginAlert" class="hidden text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 p-3 rounded-xl"></div>

                                <button type="submit" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-extrabold rounded-xl shadow-lg shadow-blue-700/25 transition text-sm">
                                    Masuk ke New Base Test <i class="fa-solid fa-arrow-right ml-1.5"></i>
                                </button>
                            </form>

                            <!-- Demo Quick Login -->
                            <div class="mt-6 pt-5 border-t border-slate-100">
                                <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest text-center mb-2.5">Isi Cepat Akun Demo</p>
                                <div class="grid grid-cols-3 gap-2">
                                    <button type="button" onclick="fillDemoCredentials('admin', 'admin123', 'admin', 'instansi')" class="py-2 px-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl text-[11px] font-bold transition truncate">
                                        <i class="fa-solid fa-shield mr-1"></i>Admin
                                    </button>
                                    <button type="button" onclick="fillDemoCredentials('siswa01', '123456', 'student', 'instansi')" class="py-2 px-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-xl text-[11px] font-bold transition truncate">
                                        <i class="fa-solid fa-school mr-1"></i>Siswa
                                    </button>
                                    <button type="button" onclick="fillDemoCredentials('mandiri01', '123456', 'student', 'mandiri')" class="py-2 px-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-xl text-[11px] font-bold transition truncate">
                                        <i class="fa-solid fa-user mr-1"></i>Mandiri
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function setLoginRole(role) {
            uiState.loginRole = role;
            renderApp();
        }

        function setLoginTrack(track) {
            uiState.loginTrack = track;
            renderApp();
        }

        function fillDemoCredentials(username, password, role, track) {
            uiState.loginRole = role;
            uiState.loginTrack = track;
            renderApp();
            setTimeout(() => {
                document.getElementById('inputUsername').value = username;
                document.getElementById('inputPassword').value = password;
            }, 10);
        }

        function processLogin(e) {
            e.preventDefault();
            const u = document.getElementById('inputUsername').value.trim();
            const p = document.getElementById('inputPassword').value.trim();
            const alertBox = document.getElementById('loginAlert');

            const users = db.getUsers();
            const account = users.find(acc => acc.username === u && acc.password === p);

            if (!account) {
                alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i> Username atau password tidak valid!';
                alertBox.classList.remove('hidden');
                return;
            }

            if (account.role !== uiState.loginRole) {

            const updated = {

                startDateTime: startVal,

        function handleQTypeChange(val) {
            const area = document.getElementById('qFormOptionsArea');
            area.style.display = val === 'essay' ? 'none' : 'block';
        }

        function submitNewQuestion(e) {
            e.preventDefault();
            const type = document.getElementById('qFormType').value;
            const points = parseInt(document.getElementById('qFormPoints').value) || 10;
            const question = document.getElementById('qFormText').value.trim();

            let options = [];
            let correct = [];

            if (type !== 'essay') {
                const optInputs = document.querySelectorAll('.q-option-input');
                const cbInputs = document.querySelectorAll('.q-correct-cb');

                optInputs.forEach((inp, idx) => {
                    if (inp.value.trim()) {
                        const newIdx = options.length;
                        options.push(inp.value.trim());
                        if (cbInputs[idx].checked) correct.push(newIdx);
                    }
                });

                if (options.length < 2) {
                    showGlobalModal('Opsi Kurang', 'Minimal isi 2 pilihan jawaban untuk soal pilihan ganda.', 'warning');
                    return;
                }
                if (correct.length === 0) {
                    showGlobalModal('Kunci Jawaban Kosong', 'Centang minimal 1 kunci jawaban yang benar.', 'warning');
                    return;
                }
                if (type === 'single' && correct.length > 1) {
                    correct = [correct[0]];
                }
            }

            const list = db.getQuestions();
            list.push({
                id: 'q_' + Date.now(),
                type,
                question,
                options,
                correct,
                points
            });
            db.saveQuestions(list);
            closeDynamicModal();
            renderApp();
            showGlobalModal('Soal Ditambahkan', 'Butir soal baru berhasil disimpan ke Bank Soal.', 'success');
        }

                renderApp();

            if (!sub || !student) return;

            const body = document.getElementById('dynamicModalBody');
            body.innerHTML = `

                        if (q.type === 'single' && ans !== undefined && q.options[ans]) {
                            renderedAns = `${String.fromCharCode(65 + ans)}. ${q.options[ans]}`;
                        } else if (q.type === 'complex' && Array.isArray(ans) && ans.length > 0) {
                            renderedAns = ans.map(i => `${String.fromCharCode(65 + i)}. ${q.options[i]}`).join(', ');
                        } else if (q.type === 'essay' && ans) {
                            renderedAns = ans;

                        const currentEssayScore = (sub.essayScores && sub.essayScores[q.id] !== undefined) ? sub.essayScores[q.id] : 0;

                        return `
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-extrabold text-blue-700">Soal #${idx + 1} (${q.type === 'single' ? 'Pilihan Ganda' : (q.type === 'complex' ? 'PG Kompleks' : 'Uraian')})</span>

                    </div>

            `;
            document.getElementById('dynamicModal').classList.remove('hidden');
            document.getElementById('dynamicModal').classList.add('flex');
        }

        function saveManualEssayGrades(e, username) {
            e.preventDefault();
            const results = db.getResults();
            const sub = results.find(r => r.username === username);
            const questions = db.getQuestions();

            if (!sub.essayScores) sub.essayScores = {};
            let essaySum = 0;

            questions.forEach(q => {
                if (q.type === 'essay') {
                    const inp = document.getElementById(`grade_essay_${q.id}`);
                    const val = parseFloat(inp.value) || 0;
                    sub.essayScores[q.id] = val;
                    essaySum += val;
                }
            });

            sub.essayTotal = essaySum;
            sub.essayGraded = true;
            sub.finalScore = sub.autoScore + essaySum;
            db.saveResults(results);

            closeDynamicModal();
            renderApp();
            showGlobalModal('Nilai Diperbarui', 'Nilai uraian berhasil disimpan dan total skor akhir peserta telah diperbarui.', 'success');
        }

        function saveUserAccount(e, editId) {
            e.preventDefault();
            const name = document.getElementById('uFormName').value.trim();
            const username = document.getElementById('uFormUsername').value.trim();
            const password = document.getElementById('uFormPassword').value.trim();
            const role = document.getElementById('uFormRole').value;
            const track = document.getElementById('uFormTrack').value;
            const institution = document.getElementById('uFormInstitution').value.trim();

            let users = db.getUsers();
            const duplicate = users.find(u => u.username === username && u.id !== editId);
            if (duplicate) {
                showGlobalModal('Username Terpakai', 'Username tersebut sudah digunakan oleh akun lain. Gunakan username yang berbeda.', 'error');
                return;
            }

            if (editId) {
                users = users.map(u => u.id === editId ? { ...u, name, username, password, role, track, institution } : u);
            } else {
                users.push({
                    id: 'u_' + Date.now(),
                    name,
                    username,
                    password,
                    role,
                    track,
                    institution
                });
            }

            db.saveUsers(users);
            closeDynamicModal();
            renderApp();
            showGlobalModal('Akun Tersimpan', 'Data akun pengguna berhasil diperbarui.', 'success');
        }

                db.saveUsers(users);
                renderApp();
            });

        async function verifyLobbyCamera() {
            const video = document.getElementById('lobbyCamVideo');
            const placeholder = document.getElementById('lobbyCamPlaceholder');
            const badge = document.getElementById('lobbyCamBadge');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                examRuntime.mediaStream = stream;
                examRuntime.cameraReady = true;
                examRuntime.cameraSimulated = false;
                if (video) {
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                }
                if (placeholder) placeholder.classList.add('hidden');
                if (badge) badge.classList.remove('hidden');
                showGlobalModal('Kamera Terverifikasi', 'Kamera pengawas aktif dan siap digunakan untuk ujian.', 'success');
            } catch (err) {
                examRuntime.cameraReady = true;
                examRuntime.cameraSimulated = true;
                if (placeholder) {
                    placeholder.innerHTML = `
                        <i class="fa-solid fa-shield-halved text-2xl text-amber-400 mb-1"></i>
                        <p class="text-[10px] text-amber-300 font-bold">Mode Simulasi AI Aktif</p>
                    `;
                }
                showGlobalModal('Mode Simulasi Pengawasan', 'Izin kamera diblokir browser/iframe. Sistem mengaktifkan sensor pengawasan simulasi agar Anda tetap dapat mengikuti ujian.', 'warning');
            }
        }

        async function launchProctoredExam() {
            const settings = db.getSettings();
            if (settings.requireCamera && !examRuntime.cameraReady) {
                await verifyLobbyCamera();
            }

            examRuntime.isActive = true;
            examRuntime.currentIndex = 0;
            examRuntime.answers = {};
            examRuntime.violations = 0;
            examRuntime.secondsRemaining = settings.durationMinutes * 60;

            if (settings.useTimer) {
                examRuntime.timerId = setInterval(() => {
                    examRuntime.secondsRemaining--;
                    const el = document.getElementById('liveExamTimer');
                    if (el) {
                        const mins = Math.floor(examRuntime.secondsRemaining / 60);
                        const secs = examRuntime.secondsRemaining % 60;
                        el.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    }
                    if (examRuntime.secondsRemaining <= 0) {
                        finishAndSubmitExam(true, 'Waktu pengerjaan telah habis.');
                    }
                }, 1000);
            }

            if (settings.requireFullscreen && document.documentElement.requestFullscreen) {
                try { await document.documentElement.requestFullscreen(); } catch (e) {}
            }

            // Register strict anti-cheat listeners
            window.addEventListener('blur', onWindowBlurViolation);
            document.addEventListener('visibilitychange', onVisibilityViolation);
            document.addEventListener('fullscreenchange', onFullscreenExitViolation);

            renderApp();
        }

        function attachActiveExamCamera() {
            const video = document.getElementById('examProctorVideo');
            const simBox = document.getElementById('examProctorSim');
            if (examRuntime.mediaStream && video) {
                video.srcObject = examRuntime.mediaStream;
                video.classList.remove('hidden');
                if (simBox) simBox.classList.add('hidden');
            } else if (simBox) {
                simBox.classList.remove('hidden');
            }
        }

        function onWindowBlurViolation() {
            if (examRuntime.isActive) recordAntiCheatViolation('Meninggalkan fokus jendela ujian (Window Blur)');
        }

        function onVisibilityViolation() {
            if (examRuntime.isActive && document.hidden) {
                recordAntiCheatViolation('Berpindah tab atau meminimalkan browser');
            }
        }

        function onFullscreenExitViolation() {
            const settings = db.getSettings();
            if (examRuntime.isActive && settings.requireFullscreen && !document.fullscreenElement) {
                recordAntiCheatViolation('Keluar dari mode Layar Penuh (Fullscreen)');
            }
        }

        let lastViolationTime = 0;
        function recordAntiCheatViolation(reason) {
            const now = Date.now();
            if (now - lastViolationTime < 2000) return; // debounce duplicate triggers
            lastViolationTime = now;

            const settings = db.getSettings();
            const user = db.getSession();
            examRuntime.violations++;

            const logs = db.getViolations();
            logs.push({
                username: user.username,
                name: user.name,
                reason,
                count: examRuntime.violations,
                timestamp: new Date().toLocaleTimeString('id-ID')
            });
            db.saveViolations(logs);

            if (examRuntime.violations >= settings.maxViolations) {
                finishAndSubmitExam(true, `Batas maksimal pelanggaran (${settings.maxViolations}x) terlampaui!`);
            } else {
                showGlobalModal(
                    `Peringatan Pelanggaran (${examRuntime.violations}/${settings.maxViolations})`,
                    `Terdeteksi aktivitas mencurigakan: "${reason}". Jika mencapai ${settings.maxViolations} pelanggaran, ujian akan otomatis dihentikan dan dikirim!`,
                    'error'
                );
                renderApp();
            }
        }

                examRuntime.answers[qId] = curr.includes(val) ? curr.filter(i => i !== val) : [...curr, val];
                renderApp();
            } else if (type === 'essay') {
                examRuntime.answers[qId] = val;
            }
        }

        function moveQuestion(delta) {
            const total = db.getQuestions().length;
            const next = examRuntime.currentIndex + delta;
            if (next >= 0 && next < total) {
                examRuntime.currentIndex = next;
                renderApp();
            }
        }

        function jumpQuestion(idx) {
            examRuntime.currentIndex = idx;

            showGlobalModal(

            );
        }

        function finishAndSubmitExam(isForced = false, reasonMsg = '') {
            const questions = db.getQuestions();
            const student = db.getSession();
            if (!student) return;

            // Calculate automatic score for Single Choice & Complex Choice
            let autoScore = 0;
            let hasEssay = false;

            questions.forEach(q => {
                const ans = examRuntime.answers[q.id];
                if (q.type === 'single') {
                    if (ans !== undefined && ans === q.correct[0]) {
                        autoScore += q.points;
                    }
                } else if (q.type === 'complex') {
                    if (Array.isArray(ans)) {
                        const aSet = new Set(ans);
                        const cSet = new Set(q.correct);
                        if (aSet.size === cSet.size && [...cSet].every(x => aSet.has(x))) {
                            autoScore += q.points;
                        }
                    }
                } else if (q.type === 'essay') {
                    hasEssay = true;
                }
            });

            const results = db.getResults().filter(r => r.username !== student.username);
            results.push({
                username: student.username,
                name: student.name,
                answers: examRuntime.answers,
                autoScore,
                essayTotal: 0,
                essayScores: {},
                essayGraded: !hasEssay,
                finalScore: autoScore,
                submittedAt: new Date().toISOString()
            });
            db.saveResults(results);

            // Cleanup runtime & proctoring listeners
            if (examRuntime.timerId) clearInterval(examRuntime.timerId);
            if (examRuntime.mediaStream) {
                examRuntime.mediaStream.getTracks().forEach(t => t.stop());
                examRuntime.mediaStream = null;
            }
            window.removeEventListener('blur', onWindowBlurViolation);
            document.removeEventListener('visibilitychange', onVisibilityViolation);
            document.removeEventListener('fullscreenchange', onFullscreenExitViolation);
            if (document.fullscreenElement && document.exitFullscreen) {
                try { document.exitFullscreen(); } catch (e) {}
            }

            examRuntime.isActive = false;
            uiState.activeMenu = 'nilai';
            renderApp();

            showGlobalModal(
                isForced ? 'Ujian Otomatis Dikirim' : 'Ujian Berhasil Dikirim',
                isForced ? `${reasonMsg} Jawaban Anda telah disimpan ke sistem.` : 'Terima kasih! Jawaban Anda telah terekam dan nilai pilihan ganda langsung dikoreksi otomatis.',
                isForced ? 'warning' : 'success'
            );
        }

        // =========================================================================

        function showGlobalModal(title, message, type = 'info', onConfirm = null) {
            const modal = document.getElementById('globalModal');
            const iconBox = document.getElementById('gModalIcon');
            const actions = document.getElementById('gModalActions');

            document.getElementById('gModalTitle').textContent = title;
            document.getElementById('gModalMessage').textContent = message;

            const styles = {
                info: { bg: 'bg-blue-100 text-blue-600', icon: 'fa-circle-info' },
                success: { bg: 'bg-emerald-100 text-emerald-600', icon: 'fa-circle-check' },
                warning: { bg: 'bg-amber-100 text-amber-600', icon: 'fa-triangle-exclamation' },
                error: { bg: 'bg-rose-100 text-rose-600', icon: 'fa-shield-exclamation' }
            };
            const st = styles[type] || styles.info;
            iconBox.className = `w-14 h-14 rounded-2xl ${st.bg} flex items-center justify-center text-2xl mb-4 mx-auto`;
            iconBox.innerHTML = `<i class="fa-solid ${st.icon}"></i>`;

            if (onConfirm) {
                actions.innerHTML = `
                    <button onclick="closeGlobalModal()" class="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">Batal</button>
                    <button id="gModalConfirmBtn" class="flex-1 py-2.5 px-4 bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs rounded-xl transition">Ya, Lanjutkan</button>
                `;
                document.getElementById('gModalConfirmBtn').onclick = () => {
                    closeGlobalModal();
                    onConfirm();
                };
            } else {
                actions.innerHTML = `
                    <button onclick="closeGlobalModal()" class="w-full py-2.5 px-5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl transition">Mengerti</button>
                `;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeGlobalModal() {
            const modal = document.getElementById('globalModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function closeDynamicModal() {
            const modal = document.getElementById('dynamicModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Boot application
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>

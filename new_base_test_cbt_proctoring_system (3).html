<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Base Test — Sistem Ujian & Pengawasan Tingkat Tinggi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            user-select: none;
        }

        input, textarea, select {
            user-select: text;
        }

        .mirror-video {
            transform: scaleX(-1);
        }

        .pulse-rec {
            animation: pulseRec 1.5s infinite;
        }

        @keyframes pulseRec {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <!-- Root Application Container -->
    <div id="app"></div>

    <!-- Global Message Modal -->
    <div id="globalModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
        <div id="globalModalBox" class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 p-6"></div>
    </div>

    <!-- Dynamic Form / Detail Modal -->
    <div id="dynamicModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
        <div id="dynamicModalBody" class="w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-white rounded-2xl shadow-2xl border border-slate-200 p-6"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==================== 1. KONFIGURASI & DEFAULT STATE ====================
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'new-base-test-prod';
        const SESSION_KEY = 'nbt_active_session_v2';
        const LOCAL_CLOUD_FALLBACK_KEY = 'nbt_cloud_mirror_' + appId;

        let db = null;
        let auth = null;
        let authUser = null;
        let cloudSyncStatus = 'Menghubungkan ke Cloud...';
        let isRemoteUpdating = false;
        let unsubscribeCloud = null;

        let currentUser = null;
        let activeMenu = 'ujian';
        let loginRole = 'student';
        let loginTrack = 'instansi';
        let participantSearchQuery = '';
        let participantTrackFilter = 'all';
        let selectedAdminFolderId = null;

        // State pengerjaan ujian aktif (siswa)
        let activeExamSession = null;
        let examTimerInterval = null;
        let cameraStream = null;
        let isSimulatedCamera = false;
        let isRequestingFullscreen = false;

        function getDefaultScheduleISO() {
            const now = new Date();
            const start = new Date(now.getTime() - 1000 * 60 * 60);
            const end = new Date(now.getTime() + 1000 * 60 * 60 * 24 * 7);

            const toLocalInput = (d) => {
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };

            return {
                startAt: toLocalInput(start),
                endAt: toLocalInput(end)
            };
        }

        function createDefaultFolder(id, name, description, schedule, questions) {
            return {
                id,
                name,
                description,
                useTimer: true,
                durationMinutes: 60,
                startAt: schedule.startAt,
                endAt: schedule.endAt,
                shuffleQuestions: true,
                requireCamera: true,
                requireFullscreen: true,
                maxViolations: 3,
                questions: questions || []
            };
        }

        function cloneDefaultState() {
            const schedule = getDefaultScheduleISO();
            const defaultFolderId = 'fld_default_1';
            const defaultQuestions = [
                {
                    id: 'q_1',
                    type: 'pg',
                    question: 'Manakah protokol keamanan yang digunakan untuk mengenkripsi komunikasi data pada peramban web modern?',
                    options: ['HTTP', 'HTTPS (TLS/SSL)', 'FTP', 'Telnet'],
                    correctAnswer: 1,
                    points: 25
                },
                {
                    id: 'q_2',
                    type: 'pg_kompleks',
                    question: 'Pilih dua komponen utama dalam arsitektur sistem komputer modern:',
                    options: [
                        'Central Processing Unit (CPU)',
                        'Random Access Memory (RAM)',
                        'Kabel HDMI Eksternal',
                        'Kertas Printer'
                    ],
                    correctAnswers: [0, 1],
                    points: 35
                },
                {
                    id: 'q_3',
                    type: 'uraian',
                    question: 'Jelaskan secara singkat pentingnya menjaga integritas dan kejujuran akademik saat mengikuti ujian berbasis komputer!',
                    options: [],
                    correctAnswer: null,
                    points: 40
                }
            ];

            return {
                folders: [
                    createDefaultFolder(
                        defaultFolderId,
                        'Folder Ujian Utama — Evaluasi Dasar',
                        'Kerjakan seluruh soal di dalam folder ini dengan jujur. Sistem mengaktifkan kamera pengawas, deteksi perpindahan tab, dan layar penuh secara otomatis.',
                        schedule,
                        defaultQuestions
                    )
                ],
                users: [
                    {
                        id: 'u_stu_1',
                        fullName: 'Alya Rahmawati',
                        participantId: '20260101',
                        username: 'siswa01',
                        password: '123456',
                        role: 'student',
                        category: 'instansi',
                        institution: 'SMAN 1 Nusantara',
                        classGroup: 'XII IPA 1'
                    },
                    {
                        id: 'u_stu_2',
                        fullName: 'Dimas Pratama',
                        participantId: '20260102',
                        username: 'siswa02',
                        password: '123456',
                        role: 'student',
                        category: 'instansi',
                        institution: 'SMAN 1 Nusantara',
                        classGroup: 'XII IPS 2'
                    },
                    {
                        id: 'u_stu_3',
                        fullName: 'Nadia Kusuma',
                        participantId: 'MND-9901',
                        username: 'mandiri01',
                        password: '123456',
                        role: 'student',
                        category: 'mandiri',
                        institution: 'Peserta Mandiri',
                        classGroup: 'Umum / Mandiri'
                    }
                ],
                submissions: [],
                inProgressSessions: {}
            };
        }

        let appState = cloneDefaultState();

        // ==================== 2. NORMALISASI & SINKRONISASI CLOUD ====================
        function normalizeCloudDoc(rawDoc) {
            const base = cloneDefaultState();
            if (!rawDoc || typeof rawDoc !== 'object') return base;

            let parsedSessions = {};
            if (typeof rawDoc.inProgressSessions === 'string') {
                try {
                    parsedSessions = JSON.parse(rawDoc.inProgressSessions) || {};
                } catch (_) {
                    parsedSessions = {};
                }
            } else if (rawDoc.inProgressSessions && typeof rawDoc.inProgressSessions === 'object') {
                parsedSessions = rawDoc.inProgressSessions;
            }

            let normalizedFolders = [];
            if (Array.isArray(rawDoc.folders) && rawDoc.folders.length > 0) {
                normalizedFolders = rawDoc.folders.map((fld, idx) => ({
                    id: fld.id || ('fld_' + (idx + 1)),
                    name: fld.name || `Folder Ujian ${idx + 1}`,
                    description: fld.description || '',
                    useTimer: fld.useTimer !== undefined ? Boolean(fld.useTimer) : true,
                    durationMinutes: Math.max(1, Number(fld.durationMinutes) || 60),
                    startAt: fld.startAt || base.folders[0].startAt,
                    endAt: fld.endAt || base.folders[0].endAt,
                    shuffleQuestions: fld.shuffleQuestions !== undefined ? Boolean(fld.shuffleQuestions) : true,
                    requireCamera: fld.requireCamera !== undefined ? Boolean(fld.requireCamera) : true,
                    requireFullscreen: fld.requireFullscreen !== undefined ? Boolean(fld.requireFullscreen) : true,
                    maxViolations: Math.max(1, Number(fld.maxViolations) || 3),
                    questions: Array.isArray(fld.questions) ? fld.questions : []
                }));
            } else if (rawDoc.examSettings || Array.isArray(rawDoc.questions)) {
                const legacySettings = rawDoc.examSettings || {};
                normalizedFolders = [
                    {
                        id: 'fld_default_1',
                        name: legacySettings.title || 'Folder Ujian Utama',
                        description: legacySettings.description || base.folders[0].description,
                        useTimer: legacySettings.useTimer !== undefined ? Boolean(legacySettings.useTimer) : true,
                        durationMinutes: Math.max(1, Number(legacySettings.durationMinutes) || 60),
                        startAt: legacySettings.startAt || base.folders[0].startAt,
                        endAt: legacySettings.endAt || base.folders[0].endAt,
                        shuffleQuestions: legacySettings.shuffleQuestions !== undefined ? Boolean(legacySettings.shuffleQuestions) : true,
                        requireCamera: legacySettings.requireCamera !== undefined ? Boolean(legacySettings.requireCamera) : true,
                        requireFullscreen: legacySettings.requireFullscreen !== undefined ? Boolean(legacySettings.requireFullscreen) : true,
                        maxViolations: Math.max(1, Number(legacySettings.maxViolations) || 3),
                        questions: Array.isArray(rawDoc.questions) ? rawDoc.questions : []
                    }
                ];
            } else {
                normalizedFolders = base.folders;
            }

            const defaultFolderId = normalizedFolders[0].id;
            const normalizedSubmissions = (Array.isArray(rawDoc.submissions) ? rawDoc.submissions : []).map(sub => ({
                ...sub,
                folderId: sub.folderId || defaultFolderId,
                folderName: sub.folderName || normalizedFolders[0].name
            }));

            return {
                folders: normalizedFolders,
                users: Array.isArray(rawDoc.users) ? rawDoc.users : base.users,
                submissions: normalizedSubmissions,
                inProgressSessions: parsedSessions || {}
            };
        }

        function saveLocalMirror(stateObj) {
            try {
                localStorage.setItem(LOCAL_CLOUD_FALLBACK_KEY, JSON.stringify(stateObj));
            } catch (_) {
                // Abaikan jika storage penuh
            }
        }

        function loadLocalMirror() {
            try {
                const raw = localStorage.getItem(LOCAL_CLOUD_FALLBACK_KEY);
                if (!raw) return null;
                return normalizeCloudDoc(JSON.parse(raw));
            } catch (_) {
                return null;
            }
        }

        function updateSyncStatusBadge(text) {
            cloudSyncStatus = text;
            const badge = document.getElementById('cloudSyncBadge');
            if (badge) {
                const span = badge.querySelector('span');
                if (span) span.textContent = text;
            }
        }

        async function persistCloudState() {
            saveLocalMirror(appState);

            if (!db || !authUser) {
                updateSyncStatusBadge('Tersimpan Lokal & Siap Sinkron');
                return;
            }

            try {
                updateSyncStatusBadge('Menyimpan ke Cloud...');
                const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cbt_state', 'master');
                const payload = {
                    folders: appState.folders,
                    users: appState.users,
                    submissions: appState.submissions,
                    inProgressSessions: JSON.stringify(appState.inProgressSessions || {}),
                    updatedAt: new Date().toISOString()
                };
                await setDoc(stateDocRef, payload, { merge: true });
                updateSyncStatusBadge('Cloud Tersinkronisasi');
            } catch (err) {
                console.error('Gagal menyimpan ke Firestore:', err);
                updateSyncStatusBadge('Tersimpan Lokal (Mode Offline)');
            }
        }

        // ==================== 3. HELPER UTILITAS & KEAMANAN ====================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function isCurrentUserAdmin() {
            return Boolean(currentUser && currentUser.role === 'admin');
        }

        function getFolderById(folderId) {
            if (!Array.isArray(appState.folders) || appState.folders.length === 0) return null;
            return appState.folders.find(f => f.id === folderId) || appState.folders[0];
        }

        function ensureSelectedAdminFolder() {
            if (!Array.isArray(appState.folders) || appState.folders.length === 0) return null;
            const exists = appState.folders.some(f => f.id === selectedAdminFolderId);
            if (!exists) {
                selectedAdminFolderId = appState.folders[0].id;
            }
            return getFolderById(selectedAdminFolderId);
        }

        function formatDateTimeDisplay(isoLocal) {
            if (!isoLocal) return '-';
            const d = new Date(isoLocal);
            if (Number.isNaN(d.getTime())) return isoLocal;
            return d.toLocaleString('id-ID', {
                weekday: 'short',
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatSeconds(totalSec) {
            const sec = Math.max(0, Math.floor(Number(totalSec) || 0));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            const pad = (n) => String(n).padStart(2, '0');
            return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        }

        function getExamScheduleStatus(settings) {
            const now = new Date();
            const start = settings.startAt ? new Date(settings.startAt) : null;
            const end = settings.endAt ? new Date(settings.endAt) : null;

            if (start && !Number.isNaN(start.getTime()) && now < start) {
                return {
                    canStart: false,
                    label: 'Belum Dibuka',
                    badgeClass: 'bg-amber-50 text-amber-700 border-amber-200',
                    reason: `Folder ujian dibuka pada ${formatDateTimeDisplay(settings.startAt)}`
                };
            }

            if (end && !Number.isNaN(end.getTime()) && now > end) {
                return {
                    canStart: false,
                    label: 'Ujian Ditutup',
                    badgeClass: 'bg-rose-50 text-rose-700 border-rose-200',
                    reason: `Waktu folder ujian berakhir pada ${formatDateTimeDisplay(settings.endAt)}`
                };
            }

            return {
                canStart: true,
                label: 'Sedang Berlangsung',
                badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                reason: 'Folder ujian terbuka dan siap dikerjakan.'
            };
        }

        function stopExamProctoring() {
            if (examTimerInterval) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            detachAntiCheatListeners();
        }

        window.showModalMessage = function(title, message, variant = 'info') {
            const modal = document.getElementById('globalModal');
            const box = document.getElementById('globalModalBox');
            if (!modal || !box) return;

            const styles = {
                success: { bg: 'bg-emerald-50 text-emerald-700', icon: 'fa-circle-check' },
                warning: { bg: 'bg-amber-50 text-amber-700', icon: 'fa-triangle-exclamation' },
                error: { bg: 'bg-rose-50 text-rose-700', icon: 'fa-circle-xmark' },
                info: { bg: 'bg-blue-50 text-blue-700', icon: 'fa-circle-info' }
            };
            const st = styles[variant] || styles.info;

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            box.innerHTML = `
                <div class="w-12 h-12 rounded-2xl ${st.bg} flex items-center justify-center text-xl mb-4">
                    <i class="fa-solid ${st.icon}"></i>
                </div>
                <h3 class="text-lg font-extrabold text-slate-900 mb-1.5">${escapeHtml(title)}</h3>
                <p class="text-sm text-slate-600 leading-relaxed mb-6">${escapeHtml(message)}</p>
                <div class="flex justify-end">
                    <button type="button" onclick="closeGlobalModal()" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold">
                        Mengerti
                    </button>
                </div>
            `;
        };

        window.closeGlobalModal = function() {
            const modal = document.getElementById('globalModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        };

        window.exportParticipantsCSV = function() {
            if (!isCurrentUserAdmin()) return;
            const headers = ['Nama Lengkap', 'Username', 'ID Peserta', 'Jalur', 'Instansi', 'Folder Ujian', 'Skor PG/PGK', 'Skor Uraian', 'Nilai Akhir', 'Pelanggaran'];
            const rows = appState.submissions.map(sub => {
                const st = appState.users.find(u => u.id === sub.userId) || {};
                return [
                    sub.fullName || st.fullName || '',
                    sub.username || st.username || '',
                    st.participantId || '',
                    sub.category === 'instansi' ? 'Instansi Sekolah' : 'Mandiri',
                    sub.institution || st.institution || '',
                    sub.folderName || '',
                    sub.autoScore || 0,
                    sub.essayScore || 0,
                    sub.finalScore || 0,
                    sub.violationsCount || 0
                ].map(val => `"${String(val).replace(/"/g, '""')}"`).join(',');
            });

            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `rekap-nilai-folder-new-base-test-${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        // ==================== 4. AUTH & NAVIGASI LOGIN ====================
        window.setLoginRole = function(role) {
            loginRole = role;
            renderApp();
        };

        window.setLoginTrack = function(track) {
            loginTrack = track;
            renderApp();
        };

        window.handleAdminInitialSetup = async function(e) {
            e.preventDefault();
            const fullName = document.getElementById('setupAdminName').value.trim();
            const institution = document.getElementById('setupAdminInst').value.trim();
            const username = document.getElementById('setupAdminUser').value.trim();
            const password = document.getElementById('setupAdminPass').value.trim();
            const adminPin = document.getElementById('setupAdminPin').value.trim();
            const errBox = document.getElementById('loginError');

            if (!fullName || !username || !password) {
                errBox.textContent = 'Nama lengkap, username, dan password wajib diisi.';
                errBox.classList.remove('hidden');
                return;
            }

            if (adminPin && adminPin.length < 4) {
                errBox.textContent = 'Kode Akses / PIN Admin minimal 4 karakter.';
                errBox.classList.remove('hidden');
                return;
            }

            const duplicate = appState.users.find(u => u.username.toLowerCase() === username.toLowerCase());
            if (duplicate) {
                errBox.textContent = 'Username tersebut sudah digunakan oleh akun lain.';
                errBox.classList.remove('hidden');
                return;
            }

            const newAdmin = {
                id: 'u_admin_' + Date.now(),
                fullName,
                participantId: adminPin ? `PIN-${adminPin}` : 'ADM',
                username,
                password,
                role: 'admin',
                category: 'instansi',
                institution: institution || 'Penyelenggara Ujian',
                classGroup: 'Administrator'
            };

            appState.users.push(newAdmin);
            currentUser = newAdmin;
            activeMenu = 'ujian';
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
            await persistCloudState();
            renderApp();
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();
            const errBox = document.getElementById('loginError');

            const matched = appState.users.find(u =>
                u.username.toLowerCase() === usernameInput.toLowerCase() &&
                u.password === passwordInput &&
                u.role === loginRole
            );

            if (!matched) {
                errBox.textContent = loginRole === 'admin'
                    ? 'Username atau password Administrator tidak sesuai.'
                    : 'Username atau password Peserta tidak ditemukan.';
                errBox.classList.remove('hidden');
                return;
            }

            if (loginRole === 'student' && matched.category !== loginTrack) {
                const jalurAsli = matched.category === 'instansi' ? 'Instansi Sekolah' : 'Mandiri / Sendiri';
                errBox.textContent = `Akun ini terdaftar pada jalur "${jalurAsli}". Silakan pilih jalur tersebut di atas.`;
                errBox.classList.remove('hidden');
                return;
            }

            currentUser = matched;
            activeMenu = 'ujian';
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));

            if (currentUser.role === 'student' && appState.inProgressSessions[currentUser.id]) {
                await resumeInterruptedExamSession(appState.inProgressSessions[currentUser.id]);
            }

            renderApp();
        };

        window.handleLogout = function() {
            stopExamProctoring();
            activeExamSession = null;
            currentUser = null;
            activeMenu = 'ujian';
            localStorage.removeItem(SESSION_KEY);
            renderApp();
        };

        window.setActiveMenu = function(menuId) {
            activeMenu = menuId;
            renderApp();
        };

        // ==================== 5. VIEW LOGIN ====================
        function renderLoginView() {
            const adminAccounts = appState.users.filter(u => u.role === 'admin');
            const hasRegisteredAdmin = adminAccounts.length > 0;
            const isAdminInitialSetup = loginRole === 'admin' && !hasRegisteredAdmin;

            return `
                <div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 flex items-center justify-center p-4 sm:p-6">
                    <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200/80">
                        <!-- Panel Informasi Kiri -->
                        <div class="lg:col-span-5 bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 p-8 sm:p-10 text-white flex flex-col justify-between relative overflow-hidden">
                            <div class="relative z-10">
                                <div class="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-white/15 border border-white/20 text-xs font-bold mb-6">
                                    <i class="fa-solid fa-shield-halved"></i>
                                    <span>CBT & Proctoring System</span>
                                </div>
                                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight mb-4">
                                    New Base Test
                                </h1>
                                <p class="text-blue-100 text-sm leading-relaxed mb-8">
                                    Platform evaluasi berbasis komputer dengan folder ujian terstruktur, pengawasan kamera langsung, deteksi pindah tab & layar penuh otomatis, serta penyimpanan cloud terintegrasi.
                                </p>

                                <div class="space-y-4">
                                    <div class="flex items-start gap-3">
                                        <div class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                                            <i class="fa-solid fa-folder-tree text-sm"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-sm font-bold">Folder Ujian Terkelola</h3>
                                            <p class="text-xs text-blue-100/85">Admin dapat membuat banyak folder ujian beserta jadwal dan bank soal masing-masing.</p>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-3">
                                        <div class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                                            <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-sm font-bold">Sinkronisasi Cloud & Anti-Refresh</h3>
                                            <p class="text-xs text-blue-100/85">Folder, soal, jadwal, akun, dan jawaban tersimpan aman meski halaman dimuat ulang.</p>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-3">
                                        <div class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                                            <i class="fa-solid fa-video text-sm"></i>
                                        </div>

            const startAt = document.getElementById('newFolderStart').value;

                requireFullscreen: true,

            closeDynamicModal();
            renderApp();

            if (appState.folders.length <= 1) {

            appState.folders = appState.folders.filter(f => f.id !== folderId);
            appState.submissions = appState.submissions.filter(s => s.folderId !== folderId);
            if (selectedAdminFolderId === folderId) {
                selectedAdminFolderId = appState.folders[0].id;

            await persistCloudState();
            renderApp();

        window.saveQuestionForm = async function(e, existingId) {
            e.preventDefault();
            if (!isCurrentUserAdmin()) return;
            const fld = ensureSelectedAdminFolder();
            if (!fld) return;
            if (!Array.isArray(fld.questions)) fld.questions = [];

            const type = document.getElementById('qFormType').value;
            const points = Math.max(1, Number(document.getElementById('qFormPoints').value) || 10);
            const question = document.getElementById('qFormText').value.trim();

            let options = [];
            let correctAnswer = null;
            let correctAnswers = [];

            if (type !== 'uraian') {
                for (let i = 0; i < 4; i++) {
                    const txt = document.getElementById(`qOptText_${i}`).value.trim();
                    if (!txt) {
                        showModalMessage('Data Belum Lengkap', `Pilihan jawaban ${String.fromCharCode(65 + i)} wajib diisi.`, 'warning');
                        return;
                    }
                    options.push(txt);
                    if (document.getElementById(`qOptCorrect_${i}`).checked) {
                        correctAnswers.push(i);
                    }
                }
                if (correctAnswers.length === 0) {
                    showModalMessage('Kunci Jawaban Kosong', 'Pilih minimal satu kunci jawaban benar.', 'warning');
                    return;
                }
                if (type === 'pg') {
                    correctAnswer = correctAnswers[0];
                }
            }

            const payload = {
                id: existingId || ('q_' + Date.now()),
                type,
                question,
                options,
                correctAnswer,
                correctAnswers,
                points
            };

            if (existingId) {
                const idx = fld.questions.findIndex(q => q.id === existingId);
                if (idx !== -1) fld.questions[idx] = payload;
            } else {
                fld.questions.push(payload);
            }

            await persistCloudState();
            closeDynamicModal();
            renderApp();
        };

            await persistCloudState();
            renderApp();
        };

                        <div class="absolute top-3 left-3 px-3 py-1 rounded-full bg-rose-600 text-white text-[11px] font-extrabold flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-white pulse-rec"></span>
                            <span>PROCTORING STANDBY</span>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="cancelCameraVerification()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-extrabold text-slate-600">
                            Batal
                        </button>
                        <button type="button" onclick="startExamSessionNow('${fld.id}')" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold flex items-center gap-2">
                            <i class="fa-solid fa-shield-check"></i>
                            <span>Masuk Ruang Ujian</span>
                        </button>
                    </div>
                </div>
            `;

            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    isSimulatedCamera = false;
                    const vid = document.getElementById('previewCamVideo');
                    if (vid) vid.srcObject = cameraStream;
                } else {
                    throw new Error('MediaDevices tidak didukung');
                }
            } catch (_) {
                isSimulatedCamera = true;
                const vid = document.getElementById('previewCamVideo');
                const fb = document.getElementById('previewCamFallback');
                if (vid) vid.classList.add('hidden');
                if (fb) fb.classList.remove('hidden');
            }
        };

        window.cancelCameraVerification = function() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            closeDynamicModal();
        };

        window.startExamSessionNow = async function(folderId) {
            closeDynamicModal();
            const fld = getFolderById(folderId);
            if (!fld) return;

            if (fld.requireFullscreen && document.documentElement.requestFullscreen) {
                try {
                    isRequestingFullscreen = true;
                    await document.documentElement.requestFullscreen();
                } catch (_) {
                    // Abaikan jika browser menolak fullscreen otomatis
                } finally {
                    setTimeout(() => { isRequestingFullscreen = false; }, 500);
                }
            }

            let orderedQuestions = [...(fld.questions || [])];
            if (fld.shuffleQuestions) {
                for (let i = orderedQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [orderedQuestions[i], orderedQuestions[j]] = [orderedQuestions[j], orderedQuestions[i]];
                }
            }

            activeExamSession = {
                userId: currentUser.id,
                folderId: fld.id,
                folderName: fld.name,
                questionOrder: orderedQuestions.map(q => q.id),
                currentIndex: 0,
                answers: {},
                flagged: {},
                violations: [],
                remainingSeconds: fld.useTimer ? (Number(fld.durationMinutes) || 60) * 60 : null,
                startedAt: new Date().toISOString()
            };

            appState.inProgressSessions[currentUser.id] = activeExamSession;
            await persistCloudState();

            attachAntiCheatListeners();
            startExamTimerLoop();
            renderApp();
        };

        function attachVideoToExamRoom() {
            const vid = document.getElementById('activeProctorVideo');
            if (vid && cameraStream && !isSimulatedCamera) {
                vid.srcObject = cameraStream;
            }
        }

        function startExamTimerLoop() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            if (!activeExamSession || activeExamSession.remainingSeconds === null) return;

            examTimerInterval = setInterval(async () => {
                if (!activeExamSession) {
                    clearInterval(examTimerInterval);
                    return;
                }
                activeExamSession.remainingSeconds -= 1;
                const timerEl = document.getElementById('examTimerDisplay');
                if (timerEl) {
                    timerEl.textContent = formatSeconds(activeExamSession.remainingSeconds);
                }

                if (activeExamSession.remainingSeconds % 15 === 0) {
                    appState.inProgressSessions[currentUser.id] = activeExamSession;
                    saveLocalMirror(appState);
                }

                if (activeExamSession.remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    await submitActiveExam(true, 'Waktu pengerjaan ujian telah habis.');
                }
            }, 1000);
        }

        // Deteksi Pelanggaran Anti-Kecurangan
        function handleVisibilityViolation() {
            if (!activeExamSession || !currentUser || currentUser.role !== 'student') return;
            if (document.hidden) {
                recordExamViolation('Meninggalkan tab / meminimalkan jendela browser');
            }
        }

        function handleWindowBlurViolation() {
            if (!activeExamSession || !currentUser || currentUser.role !== 'student') return;
            recordExamViolation('Fokus jendela berpindah ke aplikasi lain');
        }

        function handleFullscreenViolation() {
            if (!activeExamSession || !currentUser || currentUser.role !== 'student') return;
            if (isRequestingFullscreen) return;
            const fld = getFolderById(activeExamSession.folderId);
            if (fld && fld.requireFullscreen && !document.fullscreenElement) {
                recordExamViolation('Keluar dari mode Layar Penuh (Fullscreen)');
            }
        }

        function handleContextMenuBlock(e) {
            if (activeExamSession && currentUser && currentUser.role === 'student') {
                e.preventDefault();
            }
        }

        function handleCopyPasteBlock(e) {
            if (activeExamSession && currentUser && currentUser.role === 'student') {
                e.preventDefault();
                recordExamViolation('Mencoba menyalin / menempel teks selama ujian');
            }
        }

        function handlePageExitAutoSave() {
            if (!activeExamSession || !currentUser || currentUser.role !== 'student') return;
            activeExamSession.lastExitedAt = new Date().toISOString();
            activeExamSession.pendingReentryNotice = true;
            appState.inProgressSessions[currentUser.id] = activeExamSession;
            saveLocalMirror(appState);
            persistCloudState();
        }

        function attachAntiCheatListeners() {
            detachAntiCheatListeners();
            document.addEventListener('visibilitychange', handleVisibilityViolation);
            window.addEventListener('blur', handleWindowBlurViolation);
            document.addEventListener('fullscreenchange', handleFullscreenViolation);
            document.addEventListener('contextmenu', handleContextMenuBlock);
            document.addEventListener('copy', handleCopyPasteBlock);
            document.addEventListener('paste', handleCopyPasteBlock);
            window.addEventListener('pagehide', handlePageExitAutoSave);
            window.addEventListener('beforeunload', handlePageExitAutoSave);
        }

        function detachAntiCheatListeners() {
            document.removeEventListener('visibilitychange', handleVisibilityViolation);
            window.removeEventListener('blur', handleWindowBlurViolation);
            document.removeEventListener('fullscreenchange', handleFullscreenViolation);
            document.removeEventListener('contextmenu', handleContextMenuBlock);
            document.removeEventListener('copy', handleCopyPasteBlock);
            document.removeEventListener('paste', handleCopyPasteBlock);
            window.removeEventListener('pagehide', handlePageExitAutoSave);
            window.removeEventListener('beforeunload', handlePageExitAutoSave);
        }

        async function resumeInterruptedExamSession(sessionObj) {
            if (!sessionObj || !currentUser || currentUser.role !== 'student') return;
            activeExamSession = sessionObj;

            if (activeExamSession.pendingReentryNotice || activeExamSession.lastExitedAt) {
                delete activeExamSession.pendingReentryNotice;
                delete activeExamSession.lastExitedAt;
                await recordExamViolation('Keluar / menutup halaman web ujian lalu masuk kembali');
            }

            if (activeExamSession) {
                attachAntiCheatListeners();
                startExamTimerLoop();
            }
        }

        async function recordExamViolation(reason) {
            if (!activeExamSession) return;
            const fld = getFolderById(activeExamSession.folderId);
            const now = Date.now();
            const last = activeExamSession.violations[activeExamSession.violations.length - 1];
            if (last && (now - new Date(last.timestamp).getTime()) < 2500) {
                return;
            }

            activeExamSession.violations.push({
                reason,
                timestamp: new Date().toISOString()
            });

            appState.inProgressSessions[currentUser.id] = activeExamSession;
            await persistCloudState();

            const count = activeExamSession.violations.length;
            const max = Number(fld && fld.maxViolations) || 3;

            if (count >= max) {
                await submitActiveExam(true, `Batas maksimal pelanggaran (${max}x) telah tercapai: ${reason}`);
                return;
            }

            renderApp();
            showModalMessage(
                `Peringatan Pelanggaran (${count}/${max})`,
                `Sistem mendeteksi aktivitas mencurigakan: "${reason}". Jika mencapai ${max} kali, ujian akan otomatis dikumpulkan.`,
                'warning'
            );
        }

        window.reenterFullscreen = async function() {
            if (document.documentElement.requestFullscreen) {
                try {
                    isRequestingFullscreen = true;
                    await document.documentElement.requestFullscreen();
                } catch (_) {
                    // Abaikan
                } finally {
                    setTimeout(() => { isRequestingFullscreen = false; }, 500);
                }
            }
        };

        function renderActiveExamRoom() {
            const fld = getFolderById(activeExamSession.folderId);
            const bankQuestions = fld ? (fld.questions || []) : [];
            const orderedIds = activeExamSession.questionOrder || [];

                        <div class="flex items-center gap-3">
                            ${fld && fld.requireFullscreen ? `
                                <button type="button" onclick="reenterFullscreen()"

                                    <i class="fa-solid fa-expand mr-1"></i>Layar Penuh
                                </button>

                            <div class="px-3 py-1.5 rounded-xl ${vCount > 0 ? 'bg-rose-600/25 border-rose-500 text-rose-300' : 'bg-slate-800 border-slate-700 text-slate-300'} border text-xs font-extrabold">
                                <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                                Pelanggaran: ${vCount}/${maxV}
                            </div>

                            ${activeExamSession.remainingSeconds !== null ? `
                                <div class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs sm:text-sm font-extrabold flex items-center gap-2">
                                    <i class="fa-solid fa-clock"></i>
                                    <span id="examTimerDisplay">${formatSeconds(activeExamSession.remainingSeconds)}</span>

                    </header>

                    <!-- Area Soal & Sidebar Navigasi -->
                    <div class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <!-- Kolom Soal -->
                        <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-5 sm:p-7 shadow-xs flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
                                    <div class="flex items-center gap-2">
                                        <span class="px-3 py-1 rounded-xl bg-blue-600 text-white text-xs font-extrabold">
                                            Soal ${idx + 1} dari ${questions.length}
                                        </span>
                                        <span class="px-3 py-1 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">
                                            ${q.type === 'pg' ? 'Pilihan Ganda' : (q.type === 'pg_kompleks' ? 'PG Kompleks' : 'Uraian')}
                                        </span>
                                    </div>
                                    <button type="button" onclick="toggleQuestionFlag('${q.id}')"
                                        class="px-3 py-1.5 rounded-xl border text-xs font-extrabold transition ${isFlagged ? 'bg-amber-100 border-amber-400 text-amber-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
                                        <i class="fa-solid fa-flag mr-1"></i>${isFlagged ? 'Ditandai Ragu' : 'Tandai Ragu'}
                                    </button>
                                </div>

                                <p class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-6">
                                    ${escapeHtml(q.question)}
                                </p>

                                ${q.type === 'pg' ? `
                                    <div class="space-y-3">
                                        ${q.options.map((opt, oIdx) => {
                                            const selected = currentAns === oIdx;
                                            return `
                                                <button type="button" onclick="selectSingleOption('${q.id}', ${oIdx})"
                                                    class="w-full p-4 rounded-2xl border text-left transition flex items-center gap-3.5 ${selected ? 'border-blue-600 bg-blue-50/80 text-blue-950 shadow-xs' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'}">
                                                    <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold shrink-0 ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">
                                                        ${String.fromCharCode(65 + oIdx)}
                                                    </span>
                                                    <span class="text-sm font-semibold">${escapeHtml(opt)}</span>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>
                                ` : ''}

                                ${q.type === 'pg_kompleks' ? `
                                    <div class="space-y-3">

                                        ${q.options.map((opt, oIdx) => {

                                            const selected = arr.includes(oIdx);
                                            return `
                                                <button type="button" onclick="toggleMultiOption('${q.id}', ${oIdx})"
                                                    class="w-full p-4 rounded-2xl border text-left transition flex items-center gap-3.5 ${selected ? 'border-blue-600 bg-blue-50/80 text-blue-950 shadow-xs' : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'}">
                                                    <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold shrink-0 ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">
                                                        <i class="fa-solid ${selected ? 'fa-square-check' : 'fa-square'}"></i>
                                                    </span>
                                                    <span class="text-sm font-semibold">${escapeHtml(opt)}</span>
                                                </button>
                                            `;

                                ${q.type === 'uraian' ? `

                                        <textarea rows="6" oninput="updateEssayAnswer('${q.id}', this.value)"

                                            class="w-full p-4 rounded-2xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600">${escapeHtml(currentAns || '')}</textarea>

                            </div>

                                    class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-extrabold flex items-center gap-2 ${idx === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-50 text-slate-700'}">
                                    <i class="fa-solid fa-arrow-left"></i>
                                    <span>Sebelumnya</span>

                                ${idx === questions.length - 1 ? `

                                        class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-md flex items-center gap-2">
                                        <i class="fa-solid fa-paper-plane"></i>
                                        <span>Selesai & Kumpulkan</span>

                                        <span>Berikutnya</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                `}
                            </div>
                        </div>

                        <!-- Kolom Kamera Pengawas & Peta Nomor Soal -->
                        <div class="lg:col-span-4 space-y-5">
                            <!-- Feed Kamera Langsung -->
                            <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-sm">
                                <div class="relative aspect-video bg-slate-950 flex items-center justify-center">
                                    ${!isSimulatedCamera && cameraStream ? `
                                        <video id="activeProctorVideo" autoplay playsinline muted class="w-full h-full object-cover mirror-video"></video>
                                    ` : `
                                        <div class="text-center text-slate-300 p-4">
                                            <i class="fa-solid fa-user-shield text-2xl text-blue-400 mb-1.5"></i>
                                            <p class="text-xs font-bold">Pengawasan Sesi Aktif</p>
                                            <p class="text-[10px] text-slate-400">Sensor integritas & log aktivitas berjalan</p>
                                        </div>
                                    `}
                                    <div class="absolute top-2.5 left-2.5 px-2.5 py-1 rounded-full bg-rose-600 text-white text-[10px] font-extrabold flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 rounded-full bg-white pulse-rec"></span>
                                        <span>LIVE PROCTOR</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Navigasi Nomor Soal -->
                            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">

                                <div class="grid grid-cols-5 gap-2">
                                    ${questions.map((item, qIdx) => {
                                        const ans = activeExamSession.answers[item.id];
                                        const hasAns = Array.isArray(ans) ? ans.length > 0 : (ans !== undefined && ans !== null && String(ans).trim() !== '');
                                        const flagged = activeExamSession.flagged[item.id];
                                        const isCurrent = qIdx === idx;

                                        let btnStyle = 'bg-slate-100 text-slate-700 border-slate-200';
                                        if (flagged) btnStyle = 'bg-amber-400 text-slate-900 border-amber-500';
                                        else if (hasAns) btnStyle = 'bg-emerald-600 text-white border-emerald-600';

                                        return `
                                            <button type="button" onclick="navigateQuestion(${qIdx})"
                                                class="h-10 rounded-xl border text-xs font-extrabold transition ${btnStyle} ${isCurrent ? 'ring-2 ring-blue-600 ring-offset-1' : ''}">
                                                ${qIdx + 1}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>

                                <button type="button" onclick="confirmSubmitExam()"
                                    class="w-full mt-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-md flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-check-double"></i>
                                    <span>Kumpulkan Seluruh Jawaban</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.navigateQuestion = function(newIndex) {
            if (!activeExamSession) return;
            activeExamSession.currentIndex = newIndex;
            appState.inProgressSessions[currentUser.id] = activeExamSession;
            saveLocalMirror(appState);
            renderApp();
        };

        window.toggleQuestionFlag = function(qId) {
            if (!activeExamSession) return;
            activeExamSession.flagged[qId] = !activeExamSession.flagged[qId];
            appState.inProgressSessions[currentUser.id] = activeExamSession;
            saveLocalMirror(appState);
            renderApp();
        };

        window.selectSingleOption = function(qId, optionIdx) {
            if (!activeExamSession) return;
            activeExamSession.answers[qId] = optionIdx;
            appState.inProgressSessions[currentUser.id] = activeExamSession;
            saveLocalMirror(appState);
            renderApp();
        };

        window.toggleMultiOption = function(qId, optionIdx) {
            if (!activeExamSession) return;
            const prev = Array.isArray(activeExamSession.answers[qId]) ? [...activeExamSession.answers[qId]] : [];
            const pos = prev.indexOf(optionIdx);
            if (pos === -1) prev.push(optionIdx);
            else prev.splice(pos, 1);
            activeExamSession.answers[qId] = prev.sort((a, b) => a - b);
            appState.inProgressSessions[currentUser.id] = activeExamSession;
            saveLocalMirror(appState);
            renderApp();
        };

        window.updateEssayAnswer = function(qId, val) {
            if (!activeExamSession) return;
            activeExamSession.answers[qId] = val;
            appState.inProgressSessions[currentUser.id] = activeExamSession;
            saveLocalMirror(appState);
        };

        window.confirmSubmitExam = function() {
            const modal = document.getElementById('dynamicModal');
            const body = document.getElementById('dynamicModalBody');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            body.innerHTML = `
                <div class="space-y-4">
                    <h3 class="text-lg font-extrabold text-slate-900">Konfirmasi Pengumpulan Ujian</h3>
                    <p class="text-sm text-slate-600">
                        Apakah Anda yakin ingin mengakhiri ujian dan mengumpulkan seluruh jawaban sekarang? Setelah dikumpulkan, jawaban tidak dapat diubah kembali.
                    </p>
                    <div class="flex justify-end gap-2 pt-3">
                        <button type="button" onclick="closeDynamicModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-extrabold text-slate-600">
                            Kembali Mengerjakan
                        </button>
                        <button type="button" onclick="finalizeExamSubmission()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold">
                            Ya, Kumpulkan Sekarang
                        </button>
                    </div>
                </div>
            `;
        };

        window.finalizeExamSubmission = async function() {
            closeDynamicModal();
            await submitActiveExam(false, 'Dikumpulkan secara normal oleh peserta.');
        };

        async function submitActiveExam(isForced, note) {
            if (!activeExamSession || !currentUser) return;
            const fld = getFolderById(activeExamSession.folderId);
            const bankQuestions = fld ? (fld.questions || []) : [];

            let autoScore = 0;
            let maxAutoPoints = 0;
            let hasEssay = false;

            bankQuestions.forEach(q => {
                const pts = Number(q.points) || 0;
                const ans = activeExamSession.answers[q.id];

                if (q.type === 'pg') {
                    maxAutoPoints += pts;
                    if (ans === q.correctAnswer) autoScore += pts;
                } else if (q.type === 'pg_kompleks') {
                    maxAutoPoints += pts;
                    const expected = [...(q.correctAnswers || [])].sort((a, b) => a - b);
                    const actual = Array.isArray(ans) ? [...ans].sort((a, b) => a - b) : [];
                    if (expected.length === actual.length && expected.every((v, i) => v === actual[i])) {
                        autoScore += pts;
                    }
                } else if (q.type === 'uraian') {
                    hasEssay = true;
                }
            });

            const submissionRecord = {
                id: 'sub_' + Date.now(),
                userId: currentUser.id,
                folderId: activeExamSession.folderId,
                folderName: fld ? fld.name : (activeExamSession.folderName || 'Folder Ujian'),
                fullName: currentUser.fullName,
                username: currentUser.username,
                category: currentUser.category,
                institution: currentUser.institution || '-',
                answers: { ...activeExamSession.answers },
                autoScore,
                maxAutoPoints,
                essayScore: 0,
                finalScore: autoScore,
                essayGraded: !hasEssay,
                violations: [...(activeExamSession.violations || [])],
                violationsCount: (activeExamSession.violations || []).length,
                cameraMode: isSimulatedCamera ? 'Simulasi Pengawasan' : 'Kamera Langsung Aktif',
                submittedAt: new Date().toISOString(),
                note
            };

            appState.submissions = appState.submissions.filter(s => !(s.userId === currentUser.id && s.folderId === activeExamSession.folderId));
            appState.submissions.push(submissionRecord);
            delete appState.inProgressSessions[currentUser.id];

            stopExamProctoring();
            activeExamSession = null;
            activeMenu = 'nilai';

            await persistCloudState();
            renderApp();

            showModalMessage(
                isForced ? 'Ujian Otomatis Dikumpulkan' : 'Ujian Berhasil Dikumpulkan',
                note,
                isForced ? 'warning' : 'success'
            );
        }

            const body = document.getElementById('dynamicModalBody');

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            body.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">

                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                                <option value="admin" ${existing && existing.role === 'admin' ? 'selected' : ''}>Administrator</option>

                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Jalur Kepesertaan</label>
                            <select id="uFormCategory" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600">
                                <option value="instansi" ${!existing || existing.category === 'instansi' ? 'selected' : ''}>Instansi Sekolah</option>
                                <option value="mandiri" ${existing && existing.category === 'mandiri' ? 'selected' : ''}>Mandiri / Sendiri</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Nama Lengkap *</label>
                            <input id="uFormFullName" type="text" required value="${existing ? escapeHtml(existing.fullName) : ''}"
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600" />
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Nomor Peserta / ID</label>
                            <input id="uFormPartId" type="text" value="${existing ? escapeHtml(existing.participantId || '') : ''}"
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Username Login *</label>
                            <input id="uFormUsername" type="text" required value="${existing ? escapeHtml(existing.username) : ''}"
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600" />
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Password Login *</label>
                            <input id="uFormPassword" type="text" required value="${existing ? escapeHtml(existing.password) : ''}"
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Asal Sekolah / Instansi</label>
                            <input id="uFormInstitution" type="text" value="${existing ? escapeHtml(existing.institution || '') : ''}"
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600" />
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Kelas / Kelompok</label>
                            <input id="uFormClass" type="text" value="${existing ? escapeHtml(existing.classGroup || '') : ''}"
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-blue-600" />
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                        <button type="button" onclick="closeDynamicModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-extrabold text-slate-600">
                            Batal
                        </button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold">
                            Simpan Akun
                        </button>
                    </div>
                </form>
            `;
        };

        window.saveUserAccountForm = async function(e, existingId) {
            e.preventDefault();
            if (!isCurrentUserAdmin()) return;

            const role = document.getElementById('uFormRole').value;
            const category = document.getElementById('uFormCategory').value;
            const fullName = document.getElementById('uFormFullName').value.trim();
            const participantId = document.getElementById('uFormPartId').value.trim();
            const username = document.getElementById('uFormUsername').value.trim();
            const password = document.getElementById('uFormPassword').value.trim();
            const institution = document.getElementById('uFormInstitution').value.trim();
            const classGroup = document.getElementById('uFormClass').value.trim();

            const duplicate = appState.users.find(u =>
                u.username.toLowerCase() === username.toLowerCase() && u.id !== existingId
            );
            if (duplicate) {
                showModalMessage('Username Sudah Digunakan', 'Silakan gunakan username lain yang unik.', 'warning');
                return;
            }

            const payload = {
                id: existingId || ('u_' + Date.now()),
                role,
                category,
                fullName,
                participantId: participantId || (role === 'admin' ? 'ADM' : 'PST-' + Math.floor(1000 + Math.random() * 9000)),
                username,
                password,
                institution: institution || (category === 'mandiri' ? 'Peserta Mandiri' : '-'),
                classGroup: classGroup || (role === 'admin' ? 'Administrator' : 'Umum')
            };

            if (existingId) {
                const idx = appState.users.findIndex(u => u.id === existingId);
                if (idx !== -1) appState.users[idx] = payload;
                if (currentUser.id === existingId) {
                    currentUser = payload;
                    localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
                }
            } else {
                appState.users.push(payload);
            }

            await persistCloudState();
            closeDynamicModal();
            renderApp();
        };

        window.deleteUserAccount = async function(userId) {
            if (!isCurrentUserAdmin()) return;
            const target = appState.users.find(u => u.id === userId);
            if (!target) return;

            if (target.role === 'admin') {
                const adminCount = appState.users.filter(u => u.role === 'admin').length;
                if (adminCount <= 1) {
                    showModalMessage('Tidak Dapat Menghapus', 'Minimal harus tersisa satu akun Administrator aktif di dalam sistem.', 'warning');
                    return;
                }
            }

            appState.users = appState.users.filter(u => u.id !== userId);
            appState.submissions = appState.submissions.filter(s => s.userId !== userId);
            delete appState.inProgressSessions[userId];

            await persistCloudState();
            if (userId === currentUser.id) {
                handleLogout();
                return;
            }
            renderApp();
        };

        function renderStudentProfilPage() {
            const u = currentUser;
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-extrabold text-slate-900">Profil Peserta Ujian</h2>
                        <p class="text-xs sm:text-sm text-slate-500">Informasi identitas dan kredensial akun Anda dikelola oleh Administrator.</p>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-6">
                        <div class="flex items-center gap-4 border-b border-slate-100 pb-5">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center text-2xl font-extrabold">
                                ${escapeHtml((u.fullName || 'P').charAt(0).toUpperCase())}
                            </div>
                            <div>
                                <h3 class="text-xl font-extrabold text-slate-900">${escapeHtml(u.fullName)}</h3>
                                <p class="text-xs text-slate-500 mt-0.5">
                                    ${u.category === 'instansi' ? 'Peserta Jalur Instansi Sekolah' : 'Peserta Jalur Mandiri / Perorangan'}
                                </p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                                <p class="text-[11px] font-bold text-slate-500 uppercase">Nomor Identitas Peserta</p>
                                <p class="text-sm font-extrabold text-slate-900 mt-1">${escapeHtml(u.participantId || '-')}</p>
                            </div>
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                                <p class="text-[11px] font-bold text-slate-500 uppercase">Username Akun</p>
                                <p class="text-sm font-extrabold text-slate-900 mt-1">@${escapeHtml(u.username)}</p>
                            </div>
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                                <p class="text-[11px] font-bold text-slate-500 uppercase">Asal Sekolah / Instansi</p>
                                <p class="text-sm font-extrabold text-slate-900 mt-1">${escapeHtml(u.institution || '-')}</p>
                            </div>
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                                <p class="text-[11px] font-bold text-slate-500 uppercase">Kelas / Kelompok</p>
                                <p class="text-sm font-extrabold text-slate-900 mt-1">${escapeHtml(u.classGroup || '-')}</p>
                            </div>
                        </div>

                        <div class="p-4 rounded-2xl bg-blue-50 border border-blue-200 text-xs text-blue-800 flex items-center gap-2.5">
                            <i class="fa-solid fa-lock"></i>
                            <span>Untuk perubahan data biodata, username, atau reset kata sandi, silakan hubungi Administrator penyelenggara ujian.</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== 12. MODAL & RENDER UTAMA ====================
        window.closeDynamicModal = function() {
            const modal = document.getElementById('dynamicModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        };

        function renderApp() {
            const root = document.getElementById('app');
            if (!root) return;

            if (!currentUser) {
                root.innerHTML = renderLoginView();
                return;
            }

            if (currentUser.role === 'student' && activeExamSession) {
                root.innerHTML = renderActiveExamRoom();
                attachVideoToExamRoom();
                return;
            }

            root.innerHTML = renderPortalShell();
        }

        async function initCloudAndApp() {
            const localCached = loadLocalMirror();
            if (localCached) {
                appState = localCached;
            }

            try {
                const rawSession = localStorage.getItem(SESSION_KEY);
                if (rawSession) {
                    const parsedUser = JSON.parse(rawSession);
                    const freshUser = appState.users.find(u => u.id === parsedUser.id);
                    if (freshUser) {
                        currentUser = freshUser;
                        if (currentUser.role === 'student' && appState.inProgressSessions[currentUser.id]) {
                            await resumeInterruptedExamSession(appState.inProgressSessions[currentUser.id]);
                        }
                    } else {
                        localStorage.removeItem(SESSION_KEY);
                    }
                }
            } catch (_) {
                localStorage.removeItem(SESSION_KEY);
            }

            renderApp();

            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const firebaseConfig = typeof __firebase_config === 'string'
                        ? JSON.parse(__firebase_config)
                        : __firebase_config;

                    const fbApp = initializeApp(firebaseConfig);
                    auth = getAuth(fbApp);
                    db = getFirestore(fbApp);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const cred = await signInWithCustomToken(auth, __initial_auth_token);
                        authUser = cred.user;
                    } else {
                        const cred = await signInAnonymously(auth);
                        authUser = cred.user;
                    }

                    const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cbt_state', 'master');
                    const snap = await getDoc(stateDocRef);
                    if (!snap.exists()) {
                        await setDoc(stateDocRef, {
                            folders: appState.folders,
                            users: appState.users,
                            submissions: appState.submissions,
                            inProgressSessions: JSON.stringify(appState.inProgressSessions || {}),
                            updatedAt: new Date().toISOString()
                        });
                    }

                    if (unsubscribeCloud) unsubscribeCloud();
                    unsubscribeCloud = onSnapshot(stateDocRef, (docSnap) => {
                        if (!docSnap.exists() || isRemoteUpdating) return;
                        isRemoteUpdating = true;
                        try {
                            appState = normalizeCloudDoc(docSnap.data());
                            saveLocalMirror(appState);

                            if (currentUser) {
                                const updatedCurrent = appState.users.find(u => u.id === currentUser.id);
                                if (updatedCurrent) {
                                    currentUser = updatedCurrent;
                                    localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
                                    if (currentUser.role === 'student' && !activeExamSession && appState.inProgressSessions[currentUser.id]) {
                                        resumeInterruptedExamSession(appState.inProgressSessions[currentUser.id]);
                                    }
                                } else {
                                    handleLogout();
                                    return;
                                }
                            }
                            updateSyncStatusBadge('Cloud Tersinkronisasi');
                            renderApp();
                        } finally {
                            isRemoteUpdating = false;
                        }
                    }, (err) => {
                        console.warn('Listener Firestore terputus:', err);
                        updateSyncStatusBadge('Tersimpan Lokal (Mode Offline)');
                    });
                } else {
                    updateSyncStatusBadge('Penyimpanan Lokal Aktif');
                }
            } catch (err) {
                console.warn('Fallback ke penyimpanan lokal:', err);
                updateSyncStatusBadge('Penyimpanan Lokal Aktif');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCloudAndApp();
        });
    </script>
